  evidence_heading: Da Auronzo - Linea Dolomitibus
  evidence:
    page: P4
    quote: Il servizio della compagnia Dolomitibus prevede corse dirette da Cortina d’Ampezzo e da Auronzo di Cadore, con coincidenze comode da Calalzo di Cadore, dove si trova la stazione ferroviaria più vicina.
  verified: true
- field: public_transport
  value: Shuttle 444 (Tre Cime Shuttle) links Dobbiaco station with Rifugio Auronzo from mid-June to the end of September; booking is compulsory via Südtirolmobil or local ticket offices.
