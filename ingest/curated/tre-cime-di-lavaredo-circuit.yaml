  evidence:
    page: P4
    quote: Da metà giugno a fine settembre è attivo un servizio navetta che collega Dobbiaco al Rifugio Auronzo, punto di partenza per il classico giro delle Tre Cime.
  verified: true
- field: rule_camping
  value:
    value: restricted
    note: Camping is banned around the car park with fines of 100 to 500 euros. Sleeping inside a vehicle is allowed, but no tables, chairs or awnings outside.
