    quote: Per raggiungere il parcheggio al Rifugio Auronzo è necessario superare un casello di accesso automatizzato e sarà consentito solamente alle prenotazioni complete di numero di targa.
  verified: true
- field: trailhead_access
  value: A paved road of about 6 km leaves from near Lago d’Antorno and ends at the Rifugio Auronzo car park. It is usually open from late May to late October, weather permitting.
