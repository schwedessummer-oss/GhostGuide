    checked_at: 2026-11-15
    evidence_heading: "Ministerio de Cultura: Hoy se inició las reservas para los ingresos a la red de Caminos Inka en 2025"

  - field: permit
    value:
      name: Inca Trail network daily capacity (2026 opening)
      kind: quota
      how_to_apply: Spaces are reserved by agencies through the Ministerio de Cultura system.
