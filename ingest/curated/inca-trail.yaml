      official_url: https://tuboleto.cultura.pe
    source_url: https://www.culturacusco.gob.pe/noticia/imagen/con-proceso-publico-y-transparente-se-inicio-la-venta-de-entradas-para-la-llaqta-de-machupicchu-y-para-la-red-de-caminos-inka-2026/
