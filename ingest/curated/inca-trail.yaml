  - field: hazard
    value:
      type: security_advisory
      note: "UK FCDO says protests in Peru can turn violent, cause roadblocks and disrupt trains, and trains to and from Machu Picchu are occasionally suspended; local groups can call strikes with little notice."
    source_url: https://www.gov.uk/foreign-travel-advice/peru/safety-and-security
    source_title: Safety and security - Peru travel advice - GOV.UK
    publisher: UK Foreign, Commonwealth & Development Office
    checked_at: 2026-11-15
    evidence_heading: Political situation

  - field: hazard
    value:
      type: weather
      note: "The rainy season runs November to May; rockslides and mudslides can disrupt walking routes and roads and rail around Machu Picchu."
    source_url: https://www.gov.uk/foreign-travel-advice/peru/safety-and-security
    source_title: Safety and security - Peru travel advice - GOV.UK
    publisher: UK Foreign, Commonwealth & Development Office
