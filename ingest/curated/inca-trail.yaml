  - field: distance_km
    value: 33.7
    basis: one_way
    note: "SERNANP gives 33.7 km for Route 1 (Main Inka Trail) from Piscacucho (km 82); Route 2 is 29.9 km, Route 3 is 42.1 km, Route 4 is 33 km and Route 5 is 10.5 km."
    source_url: https://visitaareasnaturales.sernanp.gob.pe/en/anps/historic-sanctuary-of-machupicchu/
    source_title: Historic Sanctuary of Machupicchu - Sernanp
    publisher: SERNANP
    checked_at: 2026-11-15
    evidence_heading: Route 1 or Main Inka Trail

  - field: duration
    value: { min_days: 4, max_days: 4 }
    note: "SERNANP recommends 4 days and 3 nights for Route 1; the shorter Route 5 is a 1-day option and Route 3 is recommended as 5 days."
    source_url: https://visitaareasnaturales.sernanp.gob.pe/en/anps/historic-sanctuary-of-machupicchu/
    source_title: Historic Sanctuary of Machupicchu - Sernanp
    publisher: SERNANP
    checked_at: 2026-11-15
    evidence_heading: Route 1 or Main Inka Trail

  - field: route_type
    value: point_to_point
    note: "Route 1 starts at Piscacucho (km 82) and ends at Machu Picchu via Wiñaywayna and Intipunku."
    source_url: https://www.machupicchu.gob.pe/camino-inka/
    source_title: CAMINO INKA - Machupicchu
    publisher: Dirección Desconcentrada de Cultura Cusco (Ministerio de Cultura)
    checked_at: 2026-11-15
    evidence_heading: Rutas autorizadas

  - field: best_months
    value: [4, 5, 6, 7, 8, 9, 10]
    note: "SERNANP names April to October as the recommended season and November to March as the rainy season."
    source_url: https://visitaareasnaturales.sernanp.gob.pe/en/anps/historic-sanctuary-of-machupicchu/
    source_title: Historic Sanctuary of Machupicchu - Sernanp
    publisher: SERNANP
    checked_at: 2026-11-15
    evidence_heading: Visiting season

  - field: access_mode
    value: licensed_operator_required
    note: "Entry to the Inca Trail network is only through travel agencies authorised by the Sanctuary headquarters."
    source_url: https://visitaareasnaturales.sernanp.gob.pe/en/anps/historic-sanctuary-of-machupicchu/
    source_title: Historic Sanctuary of Machupicchu - Sernanp
    publisher: SERNANP
    checked_at: 2026-11-15
