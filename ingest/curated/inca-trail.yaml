  - field: trailhead_access
    value: "Route 1 starts at Piscacucho (km 82), about 85 km and 2.5 hours from Cusco by tourist bus; SERNANP says this bus is only available through the travel agencies."
    source_url: https://visitaareasnaturales.sernanp.gob.pe/en/anps/historic-sanctuary-of-machupicchu/
    source_title: Historic Sanctuary of Machupicchu - Sernanp
    publisher: SERNANP
    checked_at: 2026-11-15
    evidence_heading: How to get to the PNA?

  - field: public_transport
    value: "Commercial trains run from Cusco (about 4 h 10 min) and from Ollantaytambo (about 2 h 10 min) to Machu Picchu Pueblo, which is how hikers usually return."
    source_url: https://visitaareasnaturales.sernanp.gob.pe/en/anps/historic-sanctuary-of-machupicchu/
    source_title: Historic Sanctuary of Machupicchu - Sernanp
    publisher: SERNANP
    checked_at: 2026-11-15
    evidence_heading: Accesses and distances

  - field: nearest_town
    value: { name: Machu Picchu Pueblo, note: "SERNANP lists accommodation and restaurants in Machu Picchu Pueblo and Santa Teresa for the Inca Trail routes." }
    source_url: https://visitaareasnaturales.sernanp.gob.pe/en/anps/historic-sanctuary-of-machupicchu/
