  - field: permit
    value:
      name: Inca Trail network entry reservation (Route 1)
      kind: quota
      how_to_apply: Operators and travel agents book the entry spaces on the state platform tuboleto.cultura.pe; travellers go through an authorised operator rather than booking themselves.
      booking_window: "Reservations open month by month in a public event; for 2026 the January spaces opened on 17 November 2025."
      official_url: https://tuboleto.cultura.pe
    source_url: https://www.gob.pe/institucion/culturacusco/noticias/1052354-ministerio-de-cultura-hoy-se-inicio-las-reservas-para-los-ingresos-a-la-red-de-caminos-inka-en-2025
