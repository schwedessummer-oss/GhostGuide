  - field: distance_km
    value: 62.8
    basis: one_way
    note: "Park gives 39 miles point to point from Phillips Pass (outside the park) to String Lake; converted to km. Shorter suggested versions exist, e.g. Granite Canyon to Paintbrush Canyon, 38.6 miles over 4 nights."
    source_url: https://www.nps.gov/grte/planyourvisit/backcountryroutesandzones.htm
    source_title: Backcountry Camping Routes and Zones - Grand Teton National Park (U.S. National Park Service)
    publisher: National Park Service
    checked_at: 2026-11-15
    evidence_heading: Teton Crest Trail (TCT)

  - field: elevation_gain_m
    value: 2743
    note: "Page says the route climbs over 9,000 feet in total; converted to metres (x0.3048, rounded), so treat as a minimum. Riding the aerial tram from Teton Village cuts roughly 4 miles and 2,400 feet of climbing."
    source_url: https://www.nps.gov/grte/planyourvisit/backcountryroutesandzones.htm
    source_title: Backcountry Camping Routes and Zones - Grand Teton National Park (U.S. National Park Service)
    publisher: National Park Service
    checked_at: 2026-11-15
    evidence_heading: Teton Crest Trail (TCT)

  - field: route_type
    value: point_to_point
    note: "Described as a point-to-point route from Phillips Pass to String Lake, best done over several days."
    source_url: https://www.nps.gov/grte/planyourvisit/backcountryroutesandzones.htm
    source_title: Backcountry Camping Routes and Zones - Grand Teton National Park (U.S. National Park Service)
    publisher: National Park Service
    checked_at: 2026-11-15
    evidence_heading: Teton Crest Trail (TCT)

  - field: best_months
    value: [8, 9]
    note: "The park says backpacking in the Tetons is usually more pleasant in August and September; before then, snow lingers on the high passes."
    source_url: https://www.nps.gov/grte/planyourvisit/bc_knowbeforeyougo.htm
    source_title: Know Before You Go - Grand Teton National Park (U.S. National Park Service)
    publisher: National Park Service
    checked_at: 2026-11-15
    evidence_heading: Snow into July

  - field: season_note
    value: "Snow and winter conditions hang on well into July. Hurricane Pass, Paintbrush Divide and Static Peak Divide remain snowbound and hazardous into summer, and the park says the TCT needs an ice axe, crampons and self-arrest skills then."
    source_url: https://www.nps.gov/grte/planyourvisit/bc_knowbeforeyougo.htm
    source_title: Know Before You Go - Grand Teton National Park (U.S. National Park Service)
    publisher: National Park Service
    checked_at: 2026-11-15
    evidence_heading: Snow into July

  - field: season_note
    value: "The route is very popular: its camping zones are booked almost every night from late July to early September."
    source_url: https://www.nps.gov/grte/planyourvisit/backcountryroutesandzones.htm
    source_title: Backcountry Camping Routes and Zones - Grand Teton National Park (U.S. National Park Service)
    publisher: National Park Service
    checked_at: 2026-11-15
    evidence_heading: Teton Crest Trail (TCT)

  - field: permit_required
    value: conditional
    note: "Nights inside Grand Teton NP need a backcountry camping permit. Hikers who camp only on Forest Service land (no nights in the park) need no permit from either agency; Alaska Basin or Fox Creek Pass nights appear on a park permit at no charge."
    source_url: https://www.nps.gov/grte/planyourvisit/backcountry-faqs.htm
    source_title: Backcountry Camping FAQs - Grand Teton National Park (U.S. National Park Service)
    publisher: National Park Service
    checked_at: 2026-11-15
    evidence_heading: Staying in the National Forest

  - field: permit
    value:
      name: Grand Teton backcountry camping permit (advance reservation)
      kind: overnight
      how_to_apply: "Reserve one permit covering consecutive nights on Recreation.gov; about a third of the quota is sold in advance. The permit holder (or the named alternate) must collect it in person at a park permit office from the day before the trip until 10 a.m. on the start day."
      booking_window: "Opens January 11, 2027 at 8 a.m. MST for the May 1-October 31, 2027 season; reservable up to two days before the start date"
      official_url: https://www.recreation.gov/permits/4675342
      price: { amount: 20.00, currency: USD, unit: per_trip, audience: all, note: "flat, non-refundable fee per permit, plus a $7 nightly charge for each person, refunded if you cancel at least five days ahead; passes give no discount" }
      months: [5, 6, 7, 8, 9, 10]
    note: "Up to six people per permit; groups of 7-12 must use designated group sites. Reservations not picked up by 10 a.m. on the first night are cancelled as no-shows unless the office (307-739-3309) is told of a late arrival."
    source_url: https://www.nps.gov/grte/planyourvisit/bcres.htm
    source_title: Backcountry Camping Permits - Grand Teton National Park (U.S. National Park Service)
    publisher: National Park Service
    checked_at: 2026-11-15
    evidence_heading: Advanced Reservations for Backcountry Camping Permits

  - field: permit
    value:
      name: Grand Teton backcountry camping permit (walk-up)
      kind: overnight
      how_to_apply: "Go in person to the Craig Thomas Discovery & Visitor Center, Colter Bay Visitor Center or Jenny Lake Ranger Station; permits are handed out first come, first served, no earlier than the day before you start. Not available by phone or online in peak season."
      booking_window: "In person, from one day before the trip start date"
      price: { amount: 20.00, currency: USD, unit: per_trip, audience: all, note: "same fees as advance permits: $20 per permit plus $7 per person per night" }
      months: [5, 6, 7, 8, 9, 10]
    note: "Roughly two thirds of the nightly backcountry quota is kept for walk-up permits."
    source_url: https://www.nps.gov/grte/planyourvisit/bcres.htm
    source_title: Backcountry Camping Permits - Grand Teton National Park (U.S. National Park Service)
    publisher: National Park Service
    checked_at: 2026-11-15
    evidence_heading: Walk-Up Permits

  - field: permit
    value:
      name: Grand Teton winter backcountry camping permit
      kind: overnight
      how_to_apply: "Outside peak season, phone the backcountry office on 307-739-3309; a ranger goes over conditions and rules and emails the permit."
      booking_window: "November 1-April 30, by phone"
      months: [11, 12, 1, 2, 3, 4]
    source_url: https://www.nps.gov/grte/planyourvisit/bcres.htm
    source_title: Backcountry Camping Permits - Grand Teton National Park (U.S. National Park Service)
    publisher: National Park Service
    checked_at: 2026-11-15
