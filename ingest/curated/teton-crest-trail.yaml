  - field: parking
    value: "Backpackers may leave a car in a designated trailhead lot for the dates on their permit and must give its make, model and plate number."
    source_url: https://www.nps.gov/grte/planyourvisit/backcountry-faqs.htm
    source_title: Backcountry Camping FAQs - Grand Teton National Park (U.S. National Park Service)
    publisher: National Park Service
    checked_at: 2026-11-15
    evidence_heading: Parking and Shuttles

  - field: parking
    value: "Trailhead lots in the park fill up in July and August."
    source_url: https://www.nps.gov/grte/learn/management/lawsandpolicies.htm
    source_title: Laws & Policies - Grand Teton National Park (U.S. National Park Service)
    publisher: National Park Service
    checked_at: 2026-11-15
    evidence_heading: Laws & Policies

  - field: trailhead_access
    value: "The full route begins outside the park at Phillips Pass and finishes at String Lake. Alternatives start at Granite Canyon Trailhead, or take the paid aerial tram from Teton Village to skip about 4 miles and 2,400 feet of climbing."
    source_url: https://www.nps.gov/grte/planyourvisit/backcountryroutesandzones.htm
    source_title: Backcountry Camping Routes and Zones - Grand Teton National Park (U.S. National Park Service)
    publisher: National Park Service
    checked_at: 2026-11-15
    evidence_heading: Teton Crest Trail (TCT)

  - field: public_transport
    value: "The park runs no shuttle between trailheads, so hikers arrange their own transfers. Ride-hailing operates inside the park and hitchhiking is allowed, with restrictions."
    source_url: https://www.nps.gov/grte/planyourvisit/backcountry-faqs.htm
    source_title: Backcountry Camping FAQs - Grand Teton National Park (U.S. National Park Service)
    publisher: National Park Service
    checked_at: 2026-11-15
    evidence_heading: Parking and Shuttles

  - field: rule_camping
    value: { value: restricted, note: "Permit needed for every night in the park. Max two nights at one location (three on Jackson Lake); a cap of 10 nights from June 1 to Labor Day and 30 nights per year." }
    source_url: https://www.nps.gov/grte/planyourvisit/bcres.htm
    source_title: Backcountry Camping Permits - Grand Teton National Park (U.S. National Park Service)
    publisher: National Park Service
    checked_at: 2026-11-15
    evidence_heading: About

  - field: rule_fires
    value: { value: restricted, note: "Wood or charcoal fires are allowed only in existing metal rings at Jackson, Leigh, Bearpaw and Trapper lakes, so none elsewhere in the backcountry; building new rings is banned. Fuel stoves are fine." }
    source_url: https://www.nps.gov/grte/planyourvisit/back.htm
    source_title: Backcountry Camping - Grand Teton National Park (U.S. National Park Service)
    publisher: National Park Service
    checked_at: 2026-11-15
    evidence_heading: Things to Know

  - field: rule_dogs
    value: { value: not_allowed, note: "Pets may not go into the backcountry (qualified service animals excepted)." }
    source_url: https://www.nps.gov/grte/planyourvisit/back.htm
    source_title: Backcountry Camping - Grand Teton National Park (U.S. National Park Service)
    publisher: National Park Service
    checked_at: 2026-11-15
    evidence_heading: Things to Know

  - field: rule_drones
    value: { value: not_allowed, note: "Launching, landing or flying a drone or other unmanned aircraft is banned in the park." }
    source_url: https://www.nps.gov/grte/learn/management/lawsandpolicies.htm
    source_title: Laws & Policies - Grand Teton National Park (U.S. National Park Service)
    publisher: National Park Service
    checked_at: 2026-11-15
    evidence_heading: Laws & Policies

  - field: rule_group_size
    value: { value: restricted, note: "A standard backcountry permit covers at most six people; parties of 7 to 12 have to stay in designated group sites." }
    source_url: https://www.nps.gov/grte/planyourvisit/bcres.htm
    source_title: Backcountry Camping Permits - Grand Teton National Park (U.S. National Park Service)
    publisher: National Park Service
