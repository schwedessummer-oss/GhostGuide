    evidence_heading: About

  - field: hazard
    value: { type: other, note: "Steep snow lingers on passes such as Hurricane Pass, Paintbrush Divide and Static Peak Divide well into summer; slips can be serious and route-finding on snow is slow. Carry an ice axe and crampons and know self-arrest." }
    source_url: https://www.nps.gov/grte/planyourvisit/bc_knowbeforeyougo.htm
    source_title: Know Before You Go - Grand Teton National Park (U.S. National Park Service)
    publisher: National Park Service
    checked_at: 2026-11-15
    evidence_heading: Snow into July

  - field: hazard
    value: { type: wildlife, note: "Grizzly and black bears range across the whole park. Backpackers must keep all food and scented items in an IGBC-approved bear canister (free loans with the permit); hanging food is banned in the park." }
    source_url: https://www.nps.gov/grte/planyourvisit/bc_knowbeforeyougo.htm
    source_title: Know Before You Go - Grand Teton National Park (U.S. National Park Service)
    publisher: National Park Service
    checked_at: 2026-11-15
    evidence_heading: Bear Country

  - field: hazard
    value: { type: lightning, note: "Afternoon thunderstorms are frequent; keep off exposed ridges, summits, open ground and lone trees when storms build." }
    source_url: https://www.nps.gov/grte/planyourvisit/bc_knowbeforeyougo.htm
    source_title: Know Before You Go - Grand Teton National Park (U.S. National Park Service)
    publisher: National Park Service
    checked_at: 2026-11-15
    evidence_heading: Lightning

  - field: hazard
    value: { type: cold, note: "A sudden storm plus cool high-country temperatures can bring on hypothermia; pack rain gear and spare warm layers and avoid cotton." }
    source_url: https://www.nps.gov/grte/planyourvisit/bc_knowbeforeyougo.htm
    source_title: Know Before You Go - Grand Teton National Park (U.S. National Park Service)
    publisher: National Park Service
