    value: { type: remoteness, note: "Mobile coverage in the backcountry is patchy; the park suggests taking a satellite messenger. Some water sources on the route (e.g. Death Canyon Shelf, Fox Creek Pass) can dry up in late summer." }
    source_url: https://www.nps.gov/grte/planyourvisit/bc_knowbeforeyougo.htm
    source_title: Know Before You Go - Grand Teton National Park (U.S. National Park Service)
    publisher: National Park Service
    checked_at: 2026-11-15
