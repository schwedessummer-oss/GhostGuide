  evidence_heading: Czy można kupić bilet u kierowcy?
  evidence:
    page: P3
    quote: Obecnie nie ma możliwości zakupu biletu u kierowcy. Prosimy o wcześniejszą rezerwację online lub w punkcie stacjonarnym.
  verified: true
- field: closure
  value:
    status: partially_closed
    note: TPN electric minibus runs on the Morskie Oko road suspended from 14 November until further notice; the road itself and trails are not stated closed.
    as_of: *id001
  note: E-bus service suspended; walking and driving access are not addressed in this notice.
