    quote: można dojechać własnym samochodem lub transportem publicznym z Zakopanego bądź okolicznych miejscowości.
  verified: true
- field: public_transport
  value: TPN operates educational electric minibuses (e-busy) as a way to reach the Morskie Oko area.
  note: Service described by the park; see the closure fact for its current suspension.
  source_url: https://tpn.gov.pl/e-busy-do-morskiego-oka
  source_title: E-busy do Morskiego Oka – bilety, rozkład jazdy | TPN
  publisher: Tatrzański Park Narodowy
  checked_at: *id001
  evidence_heading: E-busy TPN - edukacyjne busy elektryczne do Morskiego Oka
  evidence:
    page: P3
    quote: E-busy to nowoczesna, ekologiczna i edukacyjna forma dotarcia w rejon Morskiego Oka.
  verified: true
- field: public_transport
  value: E-bus tickets cannot be bought from the driver; they must be booked online or at the TPN information point in Zakopane.
  note: Ticketing rule for the park e-bus.
  source_url: https://tpn.gov.pl/e-busy-do-morskiego-oka
