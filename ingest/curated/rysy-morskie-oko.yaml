  checked_at: *id001
  evidence_heading: Opis trasy
  evidence:
    page: P5
    quote: Odcinek od Palenicy Białczańskiej do Morskiego Oka jest zamknięty dla ruchu drogowego w latach 80-tych XX  wieku po tym jak została w kilku miejscach uszkodzona przez osuwiska. W 1998 roku odcinek Palenica-Morskie Oko został zamknięty dla ruchu rowerów. Powodem były liczne kolizje z pieszymi.
  verified: true
- field: public_transport
  value: The Palenica Białczańska / Łysa Polana trailhead can be reached by car or by public transport from Zakopane and nearby towns.
  note: General access statement from the park.
  source_url: https://tpn.gov.pl/morskie-oko-w-pigulce
