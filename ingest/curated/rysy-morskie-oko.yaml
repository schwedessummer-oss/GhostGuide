  evidence_heading: Pamiętaj o bezpieczeństwie i przepisach parku narodowego
  evidence:
    page: P4
    quote: Pamiętaj, że id 1 marca do 30 listopada obowiązuje zakaz poruszania się od zmierzchu do świtu po wszystkich szlakach na terenie Parku - wróć do samochodu przed zachodem słońca.
  verified: true
- field: hazard
  value:
    type: avalanche
    note: The road crosses the Żleb Żandarmerii gully, which often has snow avalanches.
  note: Avalanche-prone gully on the approach road; frequent snow slides are stated on the trail page.
  source_url: https://tpn.gov.pl/szlaki-turystyczne/palenica-bialczanska-morskie-oko-i-spacer-wokol-morskiego-oka
