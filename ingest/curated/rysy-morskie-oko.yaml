  checked_at: *id001
  evidence_heading: Opis trasy
  evidence:
    page: P5
    quote: Wycieczka rozpoczyna się na Palenicy Białczańskiej (990 m n.p.m.). Znajduje się tutaj duży parking, obiekty gastronomiczne, punkty biletowe TPN, oraz postój wozów konnych, które kursują do Polany Włosienicy.
  verified: true
- field: parking
  value: 'Official paid TPN car park in three zones: Palenica Białczańska at the trailhead, a roadside strip up to 1 km away, and Łysa Polana about 1.5 km away. Staff place cars by arrival order; the farthest zone is a 15-20 minute walk from the trail entrance.'
  note: Driver cannot choose the zone; early arrival gets a space nearer the trail entrance.
  source_url: https://tpn.gov.pl/parkingi-morskie-oko
  source_title: Parking Morskie Oko – bilety online, cennik | TPN
  publisher: Tatrzański Park Narodowy
  checked_at: *id001
  evidence_heading: MIEJSCE PARKOWANIA
  evidence:
    page: P2
    quote: O miejscu zaparkowania decyduje kolejność przyjazdu. Kierowca nie ma możliwości wyboru miejsca parkowania. Samochody są kierowane przez obsługę najpierw na Palenicę Białczańską, następnie na pas drogowy i na Łysą Polanę (czas dojścia do punktu wejścia na szlak to 15-20 min.).
  verified: true
- field: parking
  value: The park advises arriving before 8 am to avoid queues. An e-ticket guarantees a space at any hour, but arrival order still decides which of the three zones you get.
  note: Paraphrase of the park's early-arrival advice on the Morskie Oko page.
  source_url: https://tpn.gov.pl/morskie-oko-w-pigulce
