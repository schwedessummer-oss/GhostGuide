- field: trailhead_access
  value: The approach from Palenica Białczańska to the lake follows a road shut to motor traffic since the 1980s and to bicycles since 1998, so it is covered on foot or by horse cart.
  note: Road closure to vehicles and bikes, as described on the trail page.
  source_url: https://tpn.gov.pl/szlaki-turystyczne/palenica-bialczanska-morskie-oko-i-spacer-wokol-morskiego-oka
  source_title: Palenica Białczańska - Morskie Oko - spacer wokół Morskiego Oka
