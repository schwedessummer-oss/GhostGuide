  - field: trailhead_access
    value: "The South Kaibab Trailhead has no public parking and is closed to private vehicles; arrive on foot, by bike or on the Kaibab (Orange) shuttle, about 9 minutes from the Visitor Center. When buses are not running, Xanterra taxi (928.638.2631) can take you."
    source_url: https://www.nps.gov/places/000/south-kaibab-trail.htm
    source_title: South Kaibab Trail (U.S. National Park Service)
    publisher: National Park Service
    checked_at: 2026-11-15
    evidence_heading: Accessing South Kaibab Trailhead

