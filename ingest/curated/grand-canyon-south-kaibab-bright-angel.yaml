      kind: overnight
      how_to_apply: "Sold only in person at the South Rim Backcountry Information Center, for one night at Havasupai Gardens and no earlier than the day before the hike. Visitors in the park can join a waitlist by returning to the office at 8am each day."
      booking_window: "1 March to 30 November; at most one day before the hike start; availability not guaranteed after the August 2026 flood"
