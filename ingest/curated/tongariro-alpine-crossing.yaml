    note: Ice is expected on the track in the colder months; helmet, crampons and ice axe are advised, and slips cause many injuries.
  source_url: https://www.doc.govt.nz/parks-and-recreation/places-to-go/central-north-island/places/tongariro-national-park/things-to-do/tracks/tongariro-alpine-crossing/
