- field: trailhead_access
  value: From Santa Marta follow the Troncal del Caribe to Puerto Nuevo, then an unpaved road by 4x4 (one or two hours) to Machete Pelao, where the walk begins.
  source_url: https://www.icanh.gov.co/parques-icanh/parque-arqueologico-teyuna/como-llegar
