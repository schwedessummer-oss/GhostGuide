  - field: fee
    value:
      name: Park entrance (tarifa única de ingreso)
      amount: 75000
      currency: COP
      unit: per_person
      audience: all
      note: Single entrance fee stated by ICANH; the unit is not spelled out on the page. Tour operators set their own prices separately.
    source_url: https://www.icanh.gov.co/parques-icanh/parque-arqueologico-teyuna/horarios-y-tarifas
    source_title: Horarios y tarifas - ICANH
