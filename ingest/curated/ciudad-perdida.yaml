  - field: trailhead_access
    value: From Santa Marta take the Troncal del Caribe to Puerto Nuevo, then an unpaved road by 4x4 for one to two hours to the village of Machete Pelao, where the walk starts.
    source_url: https://www.icanh.gov.co/parques-icanh/parque-arqueologico-teyuna/como-llegar
    source_title: ¿Cómo llegar? - Parque Arqueológico Teyuna - ICANH
    publisher: Instituto Colombiano de Antropología e Historia (ICANH)
    checked_at: 2026-11-15
    evidence_heading: ¿Cómo llegar?
  - field: nearest_town
    value: { name: Santa Marta, note: Gateway city where the trip begins and where authorised operators are based. }
    source_url: https://www.icanh.gov.co/parques-icanh/parque-arqueologico-teyuna/como-llegar
    source_title: ¿Cómo llegar? - Parque Arqueológico Teyuna - ICANH
    publisher: Instituto Colombiano de Antropología e Historia (ICANH)
    checked_at: 2026-11-15
    evidence_heading: ¿Cómo llegar?
  - field: hazard
    value:
      type: river_crossing
      note: The route crosses rivers, including the Buritaca, and passes through indigenous territory.
    source_url: https://www.icanh.gov.co/parques-icanh/parque-arqueologico-teyuna/como-llegar
    source_title: ¿Cómo llegar? - Parque Arqueológico Teyuna - ICANH
    publisher: Instituto Colombiano de Antropología e Historia (ICANH)
    checked_at: 2026-11-15
    evidence_heading: ¿Cómo llegar?
  - field: hazard
    value:
      type: remoteness
      note: There is no mobile signal or communications in the park, and no rubbish collection; visitors must carry waste back to Santa Marta.
    source_url: https://www.icanh.gov.co/parques-icanh/parque-arqueologico-teyuna/informacion-para-la-visita
    source_title: Información para la visita - Parque Arqueológico Teyuna - ICANH
    publisher: Instituto Colombiano de Antropología e Historia (ICANH)
    checked_at: 2026-11-15
    evidence_heading: Recomendaciones para el visitante
  - field: hazard
    value:
      type: weather
      note: ICANH describes the climate as warm, humid and very rainy, and advises rain gear and non-leather footwear.
    source_url: https://www.icanh.gov.co/parques-icanh/parque-arqueologico-teyuna/informacion-para-la-visita
