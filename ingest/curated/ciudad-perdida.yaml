    quote: Desde Santa Marta, el viaje continúa por la Troncal del Caribe hasta el sector de Puerto Nuevo, donde se toma una vía destapada por una o dos horas en vehículo 4×4 hasta el pintoresco pueblo de Machete Pelao.
  verified: true
