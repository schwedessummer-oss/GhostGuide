  - field: closure
    value:
      status: seasonal
      note: ICANH announced the park closed from 1 to 31 October 2026. The page also warns of temporary closures for natural-risk, access, maintenance or public-order reasons.
      as_of: 2026-11-15
    source_url: https://www.icanh.gov.co/parques-icanh/parque-arqueologico-teyuna/horarios-y-tarifas
    source_title: Horarios y tarifas - ICANH
