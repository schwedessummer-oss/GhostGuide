  - field: permit
    value:
      name: Via dell'Amore access reservation
      kind: other
      how_to_apply: Access to Via dell'Amore is limited, so a reservation is needed even with a card. It can be made when buying the card or afterwards, and the site recommends booking online to skip queues.
