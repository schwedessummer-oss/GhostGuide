  - field: permit
    value:
      name: Cinque Terre Train Card
      kind: trekking_card
      how_to_apply: Buy online from the park's card site with a chosen start date. Adds second-class regional trains in the Cinque Terre to the same trail and bus access as the Trekking Card.
      official_url: https://card.parconazionale5terre.it/en/cartatreno
    source_url: https://card.parconazionale5terre.it/en/cartatreno
