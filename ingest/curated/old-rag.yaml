  - field: permit_required
    value: seasonal
    note: "From March 1 to November 30 everyone on Old Rag Mountain, including the Saddle, Ridge and Ridge Access trails, needs a day-use ticket bought in advance as well as a park entrance pass. Weakley Hollow Fire Road needs no ticket."
    source_url: https://www.nps.gov/shen/planyourvisit/faqs-oldrag.htm
    source_title: Old Rag Day-Use Ticket - Shenandoah National Park (U.S. National Park Service)
    publisher: National Park Service
    checked_at: 2026-11-15
    evidence_heading: About Day-Use Tickets

  - field: permit
    value:
      name: Old Rag day-use ticket
      kind: day_use
      how_to_apply: "Book online on Recreation.gov (account needed) or by phone on 877-444-6777 before you arrive; no tickets are sold at the Old Rag station. Each person of any age needs one; one account can book up to four a day, and the booker must show photo ID."
      booking_window: "Up to 30 days ahead: 400 tickets released at 10:00 a.m. 30 days before the date and 400 more at 10:00 a.m. 5 days before; any left can be booked on the day"
      official_url: https://www.recreation.gov/ticket/10088450/ticket/10088451
      price: { amount: 2.00, currency: USD, unit: per_person, audience: all, note: "per ticket, valid for one date only; no refunds or fee waivers; changes or cancellation until noon the day before" }
      months: [3, 4, 5, 6, 7, 8, 9, 10, 11]
    note: "800 tickets a day. A ticket does not guarantee parking. Backcountry campers inside the ticket area need a ticket for each day there. Holders of the free Access or veterans passes still need tickets."
    source_url: https://www.nps.gov/shen/planyourvisit/faqs-oldrag.htm
    source_title: Old Rag Day-Use Ticket - Shenandoah National Park (U.S. National Park Service)
    publisher: National Park Service
