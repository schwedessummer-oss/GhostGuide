  - field: parking
    value: "The NPS lot at the Old Rag boundary is free, but a ticket does not reserve a space; carpooling is urged, and October weekends are tight. The main lot has been shut for upgrades (work expected done Nov 2026); use the overflow lots meanwhile."
    source_url: https://www.nps.gov/shen/planyourvisit/faqs-oldrag.htm
    source_title: Old Rag Day-Use Ticket - Shenandoah National Park (U.S. National Park Service)
    publisher: National Park Service
    checked_at: 2026-11-15
    evidence_heading: Is parking included in my Old Rag day-use ticket?

  - field: parking
    value: "No parking on road shoulders. When the main lots fill, go to the overflow lot, which has an access trail to the ranger station. Nearby landowners sell parking, but paying them does not cover the park entrance fee."
    source_url: https://www.nps.gov/places/old-rag.htm
    source_title: Old Rag Mountain (U.S. National Park Service)
    publisher: National Park Service
    checked_at: 2026-11-15
    evidence_heading: Parking

  - field: trailhead_access
    value: "Main trailheads are on the park's eastern boundary, not Skyline Drive (1-1.5 h drive from Dickey Ridge or Byrd VCs). Reach Old Rag parking from Sperryville via Routes 522, 231 and 601, or from Madison via 231 and 602. Set navigation to the named Old Rag Parking lot, not just 'Old Rag'."
    source_url: https://www.nps.gov/places/old-rag.htm
    source_title: Old Rag Mountain (U.S. National Park Service)
    publisher: National Park Service
    checked_at: 2026-11-15
    evidence_heading: Directions

  - field: rule_dogs
    value: { value: not_allowed, note: "Pets are barred from the Saddle, Ridge and Ridge Access trails and from the stretch from Post Office Junction to Old Rag Shelter; service animals may come." }
    source_url: https://www.nps.gov/thingstodo/old-rag-circuit.htm
    source_title: Old Rag Circuit (U.S. National Park Service)
    publisher: National Park Service
    checked_at: 2026-11-15
    evidence_heading: Pets Allowed

