  - field: trailhead_access
    value: "Frey from Lago Gutiérrez: 10 km, about 900 m climb, 4-5 h one way, starting by the ranger station 2 km beyond Villa Los Coihues. Frey from Villa Catedral: 9 km, 700 m, 4-5 h one way."
    source_url: https://nahuelhuapi.gov.ar/refugio-frey-desde-el-lago-gutierrez/
    source_title: Refugio Frey desde el lago Gutiérrez - Parque Nacional Nahuel Huapi
    publisher: Administración de Parques Nacionales (APN)
    checked_at: 2026-11-15
    evidence_heading: Distancia / Desnivel
  - field: trailhead_access
    value: "Laguna Negra leg starts at the Goye stream bridge in Colonia Suiza (gravel entrance, not the paved one): 11 km, about 800 m climb, 5-6 h one way, usually done over 2 days."
    source_url: https://nahuelhuapi.gov.ar/arroyo-goye-colonia-suiza-refugio-italia-laguna-negra
    source_title: Arroyo Goye (Colonia Suiza) - Refugio Italia (Laguna Negra) - Parque Nacional Nahuel Huapi
    publisher: Administración de Parques Nacionales (APN)
    checked_at: 2026-11-15
    evidence_heading: ¿Cómo llegar?
  - field: trailhead_access
    value: "Jakob leg starts at Tambo de Báez (a Mapuche community site where parking costs a fee; gate may be shut, close it again): 14 km, 727 m climb, 5-6 h one way, usually 2 days."
    source_url: https://nahuelhuapi.gov.ar/tambo-de-baez-refugio-san-martin-laguna-jakob
    source_title: Tambo de Báez - Refugio San Martín (Laguna Jakob) - Parque Nacional Nahuel Huapi
    publisher: Administración de Parques Nacionales (APN)
    checked_at: 2026-11-15
    evidence_heading: ¿Cómo llegar?
  - field: public_transport
    value: "Frey from Lago Gutiérrez: Bariloche bus line 50 to Villa Los Coihues then a 2 km walk. Frey from Catedral: line 55 to the last stop at Cerro Catedral."
    source_url: https://nahuelhuapi.gov.ar/refugio-frey-desde-el-lago-gutierrez/
    source_title: Refugio Frey desde el lago Gutiérrez - Parque Nacional Nahuel Huapi
    publisher: Administración de Parques Nacionales (APN)
    checked_at: 2026-11-15
    evidence_heading: ¿Cómo llegar?
  - field: public_transport
    value: "Laguna Negra leg: Bariloche line 10 to the Goye bridge in Colonia Suiza, or line 20 to km 18 then line 13. Pay with a SUBE card."
    source_url: https://nahuelhuapi.gov.ar/arroyo-goye-colonia-suiza-refugio-italia-laguna-negra
    source_title: Arroyo Goye (Colonia Suiza) - Refugio Italia (Laguna Negra) - Parque Nacional Nahuel Huapi
    publisher: Administración de Parques Nacionales (APN)
    checked_at: 2026-11-15
    evidence_heading: ¿Cómo llegar?
  - field: public_transport
    value: "Jakob leg: Bariloche line 20 to Puerto Moreno (km 10.5 of Av. Bustillo), then about 5.5 km on foot by the old Catedral road and Colonia Suiza fork to Tambo de Báez."
    source_url: https://nahuelhuapi.gov.ar/tambo-de-baez-refugio-san-martin-laguna-jakob
    source_title: Tambo de Báez - Refugio San Martín (Laguna Jakob) - Parque Nacional Nahuel Huapi
