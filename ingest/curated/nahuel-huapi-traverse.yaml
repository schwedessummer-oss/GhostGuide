- field: trailhead_access
  value: For Refugio Frey, drive Av. Bustillo or Av. de los Pioneros to km 8.600, turn to Villa Los Coihues and follow the lakeside road 2 km to the ranger station where the trail starts.
  source_url: https://nahuelhuapi.gov.ar/refugio-frey-desde-el-lago-gutierrez/
  source_title: Refugio Frey desde el lago Gutiérrez – Parque Nacional Nahuel Huapi
  publisher: Administración de Parques Nacionales - Parque Nacional Nahuel Huapi
  checked_at: 2026-11-15
  evidence_heading: En caso de utilizar transporte público, se deberá tomar la línea 50 en el centro de la ciudad de Bariloche, debiendo bajar en el barrio Villa Los Coihues. Desde la parada frente al lago Gutiérrez, caminar 2km por un camino vehicular de ripio que bordea el lago Gutiérrez hasta la seccional de guardaparque. Por este camino circulan una gran cantidad de vehículos, caminar prestando atención a la circulación. De contar con vehículo particular, tomar Av. Bustillo o Av. de los Pioneros hasta el km 8.600, donde se debe tomar el desvío hasta Villa Los Coihues. Una vez allí y luego de cruzar el puente de ingreso, tomar el camino hacia la izquierda que bordea el lago durante 2 kilómetros, hasta la seccional de guardaparques donde inicia el sendero.
  evidence:
    page: P5
    quote: De contar con vehículo particular, tomar Av. Bustillo o Av. de los Pioneros hasta el km 8.600, donde se debe tomar el desvío hasta Villa Los Coihues.
  verified: true
- field: trailhead_access
  value: The Jakob route starts at Tambo de Báez, about 4 km beyond a junction 1.5 km up the old Cerro Catedral road from Puerto Moreno at km 10.5 of Av. Bustillo; the gate may be closed and must be reclosed.
