    evidence_heading: Delicate Arch

  - field: season_note
    value: "Open all year. March to October is the busy season; spring and fall are mild, summer days often top 100 F (37 C), and winter highs average 30-50 F (-1 to 10 C)."
    source_url: https://www.nps.gov/arch/planyourvisit/hours.htm
    source_title: Operating Hours & Seasons - Arches National Park (U.S. National Park Service)
    publisher: National Park Service
    checked_at: 2026-11-15
    evidence_heading: Operating Hours & Seasons

