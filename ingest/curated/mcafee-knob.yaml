    quote: CATAWBA SUSTAINABILITY CENTER (CSC) – 5061 Catawba Creek Road (VA 779) is a two-minute drive from the McAfee Knob parking via VA 311. No overnight parking. At least 25 parking spaces available.
  verified: true
- field: trailhead_access
  value: From I-81 exit 141 take VA 419 for 0.4 miles to VA 311, then drive 4.6 miles to the McAfee Knob lot on the left at the top of Catawba Mountain.
  source_url: https://www.ratc.org/at-hiking/mcafee-knob-and-the-triple-crown/
  source_title: McAfee Knob and Virginia’s Triple Crown | Roanoke Appalachian Trail Club
