  checked_at: 2026-11-15
  evidence_heading: 'From south to north, potential parking areas are:'
  evidence:
    page: P1
    quote: Take I-81 south to exit 141. Go left on Virginia VA 419, Electric Road. Go 0.4 miles to VA 311. Take right. In 4.6 miles, pass McAfee Knob trailhead parking lot on left at top of Catawba Mountain.
  verified: true
