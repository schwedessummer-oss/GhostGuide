  value: The Catawba Sustainability Center lot on VA 779 has at least 25 spaces and no overnight parking; the trip to the Knob from there is a little over 10 miles round trip.
  source_url: https://www.ratc.org/at-hiking/mcafee-knob-and-the-triple-crown/
