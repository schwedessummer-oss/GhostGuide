  - field: rule_dogs
    value: { value: not_allowed, note: Pets and exotic animals may not enter the park. }
    source_url: https://www.conaf.cl/parques/parque-nacional-torres-del-paine/
    source_title: Parque Nacional Torres del Paine - CONAF
    publisher: Corporación Nacional Forestal (CONAF)
    checked_at: 2026-11-15
    evidence_heading: Prohibiciones
  - field: rule_drones
    value: { value: restricted, note: Drones are banned inside the park except for research or professional filming with prior CONAF authorisation. }
    source_url: https://www.conaf.cl/parques/parque-nacional-torres-del-paine/
    source_title: Parque Nacional Torres del Paine - CONAF
    publisher: Corporación Nacional Forestal (CONAF)
    checked_at: 2026-11-15
    evidence_heading: Prohibiciones
  - field: rule_fires
    value: { value: not_allowed, note: Any heat source (fires, grills, gas stoves, cigarettes) is banned and penalised under Law 20653; cooking is allowed only with stoves that burn no plant material, and only in designated camp areas. }
    source_url: https://www.conaf.cl/parques/parque-nacional-torres-del-paine/
    source_title: Parque Nacional Torres del Paine - CONAF
    publisher: Corporación Nacional Forestal (CONAF)
    checked_at: 2026-11-15
    evidence_heading: Prohibiciones / Recomendaciones
  - field: rule_camping
    value: { value: restricted, note: Camping is allowed only in the authorised and signed camping areas; sleeping anywhere else is prohibited. }
    source_url: https://www.conaf.cl/parques/parque-nacional-torres-del-paine/
    source_title: Parque Nacional Torres del Paine - CONAF
    publisher: Corporación Nacional Forestal (CONAF)
    checked_at: 2026-11-15
    evidence_heading: Recomendaciones
  - field: rule_group_size
    value: { value: restricted, note: "Park rules tell hikers to walk accompanied and not alone; no maximum group size is stated." }
    source_url: https://www.conaf.cl/parques/parque-nacional-torres-del-paine/
    source_title: Parque Nacional Torres del Paine - CONAF
    publisher: Corporación Nacional Forestal (CONAF)
    checked_at: 2026-11-15
    evidence_heading: Respecto al senderismo
  - field: hazard
    value: { type: wildlife, note: CONAF warns that walking in the dark risks getting lost, falling or a puma attack, and that most fatal accidents involved people walking alone or leaving the trail. Walking trails without daylight is banned. }
    source_url: https://www.conaf.cl/parques/parque-nacional-torres-del-paine/
    source_title: Parque Nacional Torres del Paine - CONAF
    publisher: Corporación Nacional Forestal (CONAF)
    checked_at: 2026-11-15
    evidence_heading: Respecto al senderismo
  - field: hazard
    value: { type: remoteness, note: The park has no basic services in the mountains and help for an emergency can take several hours to arrive. Mobile coverage exists only at Villa Monzino. }
    source_url: https://www.conaf.cl/parques/parque-nacional-torres-del-paine/
    source_title: Parque Nacional Torres del Paine - CONAF
    publisher: Corporación Nacional Forestal (CONAF)
    checked_at: 2026-11-15
    evidence_heading: Seguridad
  - field: hazard
    value: { type: weather, note: "Page lists snow risk for May to September on the W sections, snow, floods and avalanches between Grey and Paine Grande, and asks hikers on the O sections to keep checking the forecast and the circuit protocol." }
    source_url: https://www.conaf.cl/parques/parque-nacional-torres-del-paine/
    source_title: Parque Nacional Torres del Paine - CONAF
    publisher: Corporación Nacional Forestal (CONAF)
    checked_at: 2026-11-15
    evidence_heading: Senderos habilitados
  - field: hazard
    value: { type: other, note: "The final Base Torres section crosses glacial moraine, where leg joint injuries can happen." }
    source_url: https://www.conaf.cl/parques/parque-nacional-torres-del-paine/
    source_title: Parque Nacional Torres del Paine - CONAF
    publisher: Corporación Nacional Forestal (CONAF)
    checked_at: 2026-11-15
    evidence_heading: Sendero Guardería Torres-Mirador Base Torres
  - field: trailhead_access
    value: "Reached by paved road Punta Arenas to Puerto Natales, then Route 9 north; alternatively the 80 km Lago Porteño road (Y-290) from Puerto Natales. There is also a border crossing at Río Don Guillermo near Cerro Castillo."
    source_url: https://www.conaf.cl/parques/parque-nacional-torres-del-paine/
    source_title: Parque Nacional Torres del Paine - CONAF
    publisher: Corporación Nacional Forestal (CONAF)
    checked_at: 2026-11-15
    evidence_heading: Accesos
  - field: public_transport
    value: "Four regular bus companies run from Puerto Natales at 7:30 and 14:30 to Laguna Amarga, Pudeto and the park administration. Catamarans cross Lago Grey and Lago Pehoé."
    source_url: https://www.conaf.cl/parques/parque-nacional-torres-del-paine/
    source_title: Parque Nacional Torres del Paine - CONAF
    publisher: Corporación Nacional Forestal (CONAF)
    checked_at: 2026-11-15
    evidence_heading: Servicios
  - field: nearest_town
    value: { name: Puerto Natales, note: Main gateway; bus services to the park leave from here and the nearest hospital is here (80-140 km). }
    source_url: https://www.conaf.cl/parques/parque-nacional-torres-del-paine/
    source_title: Parque Nacional Torres del Paine - CONAF
    publisher: Corporación Nacional Forestal (CONAF)
    checked_at: 2026-11-15
    evidence_heading: Servicios
  - field: closure
    value: { status: open, note: "CONAF says no Base Torres access regulation will be applied in the 2026 season; it may be considered later. No closure of the W or O is stated on the pages checked.", as_of: 2026-11-15 }
