  - field: permit
    value:
      name: Torres del Paine park entry ticket
      kind: day_use
      how_to_apply: CONAF directs visitors to buy the entry ticket on its Pases Parques site, which also shows current hours and conditions.
      booking_window: "Sales for 2027 are paused during November 2026 for a price update and reopen from December 2026"
      official_url: https://www.pasesparques.cl/es/torres-del-paine-300/parque-nacional-torres-del-paine-3412
    note: The page says anyone who books overnight accommodation inside the park has entry tickets guaranteed. Lodging, refugios and campsites are limited-capacity concessions booked directly with the operators.
    source_url: https://www.pasesparques.cl/es/torres-del-paine-300/parque-nacional-torres-del-paine-3412
    source_title: Entrada Parque Nacional Torres Del Paine (Sitio Oficial) - Pases Digitales Parques Nacionales
    publisher: CONAF (Pases Parques)
    checked_at: 2026-11-15
    evidence_heading: INFORMACIÓN IMPORTANTE
  - field: permit
    value:
      name: Torres del Paine entry pricing structure (from 1 May 2026)
      kind: other
      how_to_apply: From 1 May 2026 CONAF sells a one-day entry and an entry for two or more days, valid for a continuous stretch of up to 10 days. Amounts per category are on Pases Parques.
      official_url: https://www.pasesparques.cl/es
    note: Exact fees are not stated on the CONAF page, so none are recorded here.
    source_url: https://www.conaf.cl/el-1-de-mayo-entra-en-vigencia-nuevo-sistema-tarifario-para-el-parque-nacional-torres-del-paine/
    source_title: El 1° de mayo entra en vigencia nuevo sistema tarifario para el Parque Nacional Torres del Paine - CONAF
