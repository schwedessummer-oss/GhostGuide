    checked_at: 2026-11-15
    evidence_heading: El 1° de mayo entra en vigencia nuevo sistema tarifario para el Parque Nacional Torres del Paine
  - field: season_note
    value: "Park hours: summer (October to April) 07:00-21:00 with last entry 21:00; winter (May to September) 08:00-18:30 with last entry 18:30. Hours and days can change with weather or safety orders. Microspikes and trekking poles are required or strongly recommended for safety."
    source_url: https://www.pasesparques.cl/es/torres-del-paine-300/parque-nacional-torres-del-paine-3412
    source_title: Entrada Parque Nacional Torres Del Paine (Sitio Oficial) - Pases Digitales Parques Nacionales
    publisher: CONAF (Pases Parques)
    checked_at: 2026-11-15
    evidence_heading: Temporada / Horario
  - field: season_note
    value: "In winter the W sections between Paine Grande, Italiano, Británico, Chileno and Torres, and Grey to Paine Grande, are walked only with a guide under the park's winter protocol. The O Circuit stretches from Serón through Dickson, Los Perros, Paso and Grey are rated closed in winter. Snow risk is listed for May to September."
    source_url: https://www.conaf.cl/parques/parque-nacional-torres-del-paine/
    source_title: Parque Nacional Torres del Paine - CONAF
    publisher: Corporación Nacional Forestal (CONAF)
    checked_at: 2026-11-15
    evidence_heading: Senderos habilitados
  - field: access_mode
    value: independent
    note: No official page found that requires a licensed operator in summer; in winter parts of the W need a guide (see season note).
    source_url: https://www.conaf.cl/parques/parque-nacional-torres-del-paine/
    source_title: Parque Nacional Torres del Paine - CONAF
    publisher: Corporación Nacional Forestal (CONAF)
    checked_at: 2026-11-15
    evidence_heading: Senderos habilitados
  - field: licensed_operator_list_url
    value: https://www.pasesparques.cl/es/torres-del-paine-300/parque-nacional-torres-del-paine-3412
    note: The ticket page links an official list of accredited specialised guides (used for the winter guided sections).
    source_url: https://www.pasesparques.cl/es/torres-del-paine-300/parque-nacional-torres-del-paine-3412
