  - field: parking
    value: "There is a car park at the North Kaibab trailhead. On the South Rim, hikers can leave cars at the Backcountry Information Center (Lot D), a short walk from the Bright Angel Trailhead. Lock valuables out of sight."
    source_url: https://www.nps.gov/grca/planyourvisit/hiking-faq.htm
    source_title: Hiking Frequently Asked Questions - Grand Canyon National Park (U.S. National Park Service)
    publisher: National Park Service
    checked_at: 2026-11-15
    evidence_heading: "Q: Where do I park my vehicle(s)?"

  - field: trailhead_access
    value: "The North Rim is open for limited day use through 30 Nov 2026 or until the first big snowstorm. Its campground and gas station have closed for the season; fuel is sold at Jacob Lake and the North Rim Country Store."
    source_url: https://www.nps.gov/grca/northrimstatus.htm
    source_title: Status of the North Rim - Grand Canyon National Park (U.S. National Park Service)
    publisher: National Park Service
    checked_at: 2026-11-15
    evidence_heading: North Rim — OPEN through Nov. 30, 2026 (or the first major snowstorm of the season)

  - field: public_transport
    value: "At the South Rim end, the free Village (Blue) shuttle runs from the Visitor Center to Hermit Road Interchange, a short walk uphill from the Bright Angel Trailhead."
    source_url: https://www.nps.gov/places/000/bright-angel-trail.htm
    source_title: Bright Angel Trail (U.S. National Park Service)
    publisher: National Park Service
    checked_at: 2026-11-15
    evidence_heading: Where to Park

