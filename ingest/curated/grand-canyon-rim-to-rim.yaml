  - field: rule_camping
    value: { value: restricted, note: "A backcountry permit is needed. Corridor camping (Havasupai Gardens, Bright Angel, Cottonwood) is in designated campgrounds only, up to 2 nights per campground per hike; 15 Nov-28 Feb the Corridor limit rises to 4 nights per campground." }
    source_url: https://www.nps.gov/grca/planyourvisit/backcountry-permit.htm
    source_title: Backcountry Permit - Grand Canyon National Park (U.S. National Park Service)
    publisher: National Park Service
    checked_at: 2026-11-15
