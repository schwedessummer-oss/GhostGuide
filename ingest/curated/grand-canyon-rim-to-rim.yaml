  - field: closure
    value:
      status: closed
      note: "Closed after the 29 Aug 2026 flash flood: the whole North Kaibab Trail incl. Cottonwood Campground, all of Phantom Ranch incl. Bright Angel Campground, and the Black and Silver bridges. NPS gives no reopening estimate."
      as_of: 2026-11-13
    source_url: https://www.nps.gov/grca/planyourvisit/key-messages.htm
    source_title: Key Hiking Messages - Critical Updates and Closures - Grand Canyon National Park (U.S. National Park Service)
    publisher: National Park Service
    checked_at: 2026-11-15
    evidence_heading: Trail Status, and Current Closures

  - field: closure
    value:
      status: closed
      note: "The North Rim FAQ answers no to whether the North Kaibab Trail is open: it has been shut end to end since 29 Aug 2026 because of flash flooding, along with Phantom Ranch and both river bridges, with no reopening date."
      as_of: 2026-11-10
    source_url: https://www.nps.gov/grca/northrimstatus.htm
    source_title: Status of the North Rim - Grand Canyon National Park (U.S. National Park Service)
    publisher: National Park Service
    checked_at: 2026-11-15
    evidence_heading: Is the North Kaibab Trail open?

  - field: route_type
    value: point_to_point
    note: "The North Kaibab Trail drops from the North Rim to the Colorado River and the Bright Angel Trail climbs from the river to the South Rim, so the crossing starts and ends at different rims."
    source_url: https://www.nps.gov/grca/planyourvisit/trail-distances.htm
    source_title: Backcountry Trail Distances - Grand Canyon National Park (U.S. National Park Service)
    publisher: National Park Service
    checked_at: 2026-11-15
    evidence_heading: Corridor Trails Distances

  - field: high_point_m
    value: 2512
    note: "Elevation of the North Kaibab Trailhead, the route's North Rim start, as given in the park's distance table (8241 ft / 2512 m)."
    source_url: https://www.nps.gov/grca/planyourvisit/trail-distances.htm
    source_title: Backcountry Trail Distances - Grand Canyon National Park (U.S. National Park Service)
    publisher: National Park Service
    checked_at: 2026-11-15
    evidence_heading: Corridor Trails Distances

  - field: season_note
    value: "North Rim winter rules begin when snow closes Highway 67 or on 1 December, whichever is first, and last until the rim reopens in mid-May. In winter the North Rim can only be reached on foot, snowshoes or skis."
    source_url: https://www.nps.gov/grca/planyourvisit/backcountry-permit.htm
    source_title: Backcountry Permit - Grand Canyon National Park (U.S. National Park Service)
    publisher: National Park Service
    checked_at: 2026-11-15
    evidence_heading: North Rim Winter Use

  - field: permit_required
    value: conditional
    note: "Day hikes, including night-time ones, need no permit. Camping anywhere below the rim needs a Grand Canyon backcountry permit; guests with Phantom Ranch cabin or dorm reservations do not need one."
    source_url: https://www.nps.gov/grca/planyourvisit/backcountry-permit.htm
    source_title: Backcountry Permit - Grand Canyon National Park (U.S. National Park Service)
    publisher: National Park Service
    checked_at: 2026-11-15
    evidence_heading: Backcountry Permit

  - field: permit
    value:
      name: Grand Canyon backcountry permit
      kind: overnight
      how_to_apply: "Enter the early access lottery on Recreation.gov; up to 750 winners get a time slot to pick and pay for an itinerary. Any space left opens to everyone on the 1st of the following month, and start dates within three months can be booked directly."
      booking_window: "Lottery opens on the 16th of the month five months before the start month and closes at 5pm MST on the 1st, four months before; remaining space opens to all at 8am MST on the 1st of the next month"
      official_url: https://www.recreation.gov/permits/4675337
      price: { amount: 10.00, currency: USD, unit: per_application, audience: all, note: "plus $15 per person per night in below-rim areas; park entrance fee paid separately" }
    source_url: https://www.nps.gov/grca/planyourvisit/backcountry-permit.htm
    source_title: Backcountry Permit - Grand Canyon National Park (U.S. National Park Service)
    publisher: National Park Service
    checked_at: 2026-11-15
    evidence_heading: When to Apply

  - field: permit
    value:
      name: Special Use Permit for organized group rim-to-rim hikes
      kind: other
      how_to_apply: "Organized non-commercial groups of 12 to 30, and not-for-profit groups, doing rim-to-rim or other long inner-canyon day hikes or runs need this permit. Groups may not split onto separate permits to get around the size rule; commercial trips are not covered."
      official_url: https://www.nps.gov/grca/getinvolved/sup.htm
    source_url: https://www.nps.gov/grca/planyourvisit/backcountry-permit.htm
    source_title: Backcountry Permit - Grand Canyon National Park (U.S. National Park Service)
    publisher: National Park Service
    checked_at: 2026-11-15
    evidence_heading: Organized Group Rim-to-Rim and Extended Day Hike/Run

