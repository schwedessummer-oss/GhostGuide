  - field: rule_group_size
    value: { value: restricted, max_group: 11, note: "Camping groups may not exceed 11 people in one campground or use area, and affiliated groups may not share one on the same night. Organized groups of 12-30 doing rim-to-rim day hikes need a Special Use Permit." }
