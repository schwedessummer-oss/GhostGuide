  - field: hazard
    value: { type: heat, note: "Shade temperatures often top 100°F (38°C) in summer. In May-September start well before dawn or after 3 p.m. and stay off the trail 10 am-4 pm; NPS advises against hiking the whole North Kaibab Trail in one day, above all in summer." }
