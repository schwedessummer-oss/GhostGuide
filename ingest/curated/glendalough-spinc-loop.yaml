  checked_at: '2026-11-15'
  evidence:
    page: P5
    quote: Wicklow County Council operate a FREE car park in Laragh, beside the Woollen Mills and the G.A.A. pitch. There is a 3 km walk through the woods along the Green Road to reach the Upper Lake and the National Park Information Office.
  verified: true
- field: parking
  value: Visitor Centre car park beside the Monastic City is pay-by-machine, coin or card, open 8am to 8pm.
  source_url: https://www.nationalparks.ie/wicklow/parking-in-glendalough/
  source_title: Parking In Glendalough - National Parks of Ireland
  publisher: National Parks of Ireland
  checked_at: '2026-11-15'
  evidence:
    page: P5
    quote: Machine payment for parking is by coin or card. Opening hours are from 8 a.m. to 8 p.m.
  verified: true
- field: parking
  value: Upper Lake car park sits at the end of the valley road, charges at the entrance and can mean long queues on a narrow road when full.
  source_url: https://www.nationalparks.ie/wicklow/parking-in-glendalough/
  source_title: Parking In Glendalough - National Parks of Ireland
  publisher: National Parks of Ireland
  checked_at: '2026-11-15'
  evidence:
    page: P5
    quote: The Upper Lake car park is located right at the end of the road into the valley. Be warned, if this car park is full, you could be stuck in long queues on a narrow road. This car park is managed by Wicklow County Council. There is a parking charge at the entrance.
  verified: true
- field: public_transport
  value: Dublin city bus route 181 (privately run St Kevin's) serves Glendalough; Local Link routes 183 from Arklow and 895 from Sallins also go there.
  source_url: https://www.wicklowmountainsnationalpark.ie/
