    publisher: Instituto Chico Mendes de Conservação da Biodiversidade (ICMBio)
    checked_at: 2026-11-15
    evidence_heading: Cuidados com o ambiente natural
  - field: rule_camping
    value: { value: restricted, note: "On other multi-day crossings camping is wild and unserviced. In the Pati valley itself visitors can stay in residents' homes or use the listed camping spots near the houses; avoid river banks and caves and do not create new sites." }
    source_url: https://www.gov.br/icmbio/pt-br/assuntos/unidade-de-conservacao/unidades-de-biomas/caatinga/lista-de-ucs/parna-da-chapada-da-diamantina/informacoes-sobre-visitacao-parna-da-chapada-da-diamantina
    source_title: Informações Sobre Visitação - Parna da Chapada Diamantina
    publisher: Instituto Chico Mendes de Conservação da Biodiversidade (ICMBio)
    checked_at: 2026-11-15
    evidence_heading: Travessias; Cuidados com o ambiente natural
  - field: hazard
    value: { type: remoteness, note: "There is no mobile signal inside the park and the trails are unmarked in places. The park urges telling someone your plan and not hiking alone." }
    source_url: https://www.gov.br/icmbio/pt-br/assuntos/unidade-de-conservacao/unidades-de-biomas/caatinga/lista-de-ucs/parna-da-chapada-da-diamantina/informacoes-sobre-visitacao-parna-da-chapada-da-diamantina
    source_title: Informações Sobre Visitação - Parna da Chapada Diamantina
    publisher: Instituto Chico Mendes de Conservação da Biodiversidade (ICMBio)
    checked_at: 2026-11-15
    evidence_heading: Dicas de segurança
  - field: hazard
    value: { type: other, note: "River pools are dark, hiding rocks and logs, and rain changes the river bed. The park warns against jumping into them." }
    source_url: https://www.gov.br/icmbio/pt-br/assuntos/unidade-de-conservacao/unidades-de-biomas/caatinga/lista-de-ucs/parna-da-chapada-da-diamantina/informacoes-sobre-visitacao-parna-da-chapada-da-diamantina
    source_title: Informações Sobre Visitação - Parna da Chapada Diamantina
    publisher: Instituto Chico Mendes de Conservação da Biodiversidade (ICMBio)
    checked_at: 2026-11-15
    evidence_heading: Dicas de segurança
  - field: trailhead_access
    value: The Capão crossings start in the Bomba hamlet in Vale do Capão (Palmeiras). The Guiné route starts near Guiné in Mucugê. The shortest valley access takes about three hours.
    source_url: https://www.gov.br/icmbio/pt-br/assuntos/unidade-de-conservacao/unidades-de-biomas/caatinga/lista-de-ucs/parna-da-chapada-da-diamantina/informacoes-sobre-visitacao-parna-da-chapada-da-diamantina
    source_title: Informações Sobre Visitação - Parna da Chapada Diamantina
    publisher: Instituto Chico Mendes de Conservação da Biodiversidade (ICMBio)
    checked_at: 2026-11-15
    evidence_heading: Travessias / 4 dias e 5 dias
  - field: public_transport
    value: Regular daily buses reach Andaraí and Mucugê. Vans carry passengers from Palmeiras to Capão, and local transport around the park is limited.
    source_url: https://www.gov.br/icmbio/pt-br/assuntos/unidade-de-conservacao/unidades-de-biomas/caatinga/lista-de-ucs/parna-da-chapada-da-diamantina/informacoes-sobre-visitacao-parna-da-chapada-da-diamantina
    source_title: Informações Sobre Visitação - Parna da Chapada Diamantina
    publisher: Instituto Chico Mendes de Conservação da Biodiversidade (ICMBio)
    checked_at: 2026-11-15
    evidence_heading: Como chegar
  - field: nearest_town
    value: { name: Palmeiras, note: "The park headquarters are in Palmeiras. Mucugê and Andaraí are other gateway towns." }
    source_url: https://www.gov.br/icmbio/pt-br/assuntos/unidade-de-conservacao/unidades-de-biomas/caatinga/lista-de-ucs/parna-da-chapada-da-diamantina/informacoes-sobre-visitacao-parna-da-chapada-da-diamantina
