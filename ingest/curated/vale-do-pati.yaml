    value: 40
    note: ICMBio gives 40 km for the 3-day Capão to Mucugê crossing through the Pati valley, 38 km of it inside the park. It also lists Guiné to Andaraí as 30 km in 4 days and Capão to Andaraí as about 60 km in 5 days.
