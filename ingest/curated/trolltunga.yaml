- field: parking
  value: Three car parks serve the hike. P1 Tyssedal and P2 Skjeggedal need no advance booking, while the upper private P3 Mågelitopp requires a reservation in high season. Start early.
  source_url: https://www.trolltunga.com/en/parking-and-transport/shuttle-busses
  source_title: Shuttle buses to Trolltunga | Trolltunga official website
  publisher: Trolltunga official website (trolltunga.com)
  checked_at: '2026-11-15'
  evidence_heading: Parking at Trolltunga
  evidence:
    page: P3
    quote: P3 Mågelitopp requires a reservation during the high season, as it fills up quickly. P1 Tyssedal and P2 Skjeggedal do not require advance booking, but we recommend starting your hike early in the day.
  verified: true
- field: trailhead_access
  value: Drive Rv13 to Tyssedal near Odda, then follow the Trolltunga signs up the toll road to P2 Skjeggedal; P3 is a short drive beyond.
  source_url: https://www.trolltunga.com/en/parking-and-transport/parking
  source_title: Parking | Trolltunga official website
  publisher: Trolltunga official website (trolltunga.com)
  checked_at: '2026-11-15'
  evidence_heading: By car to Trolltunga
  evidence:
    page: P4
    quote: Follow route RV13 to Tyssedal, 6 km from the centre of Odda. Turn right and follow the signs to Trolltunga. It will take about 30 minutes by car from Odda to Skjeggedal.
  verified: true
- field: public_transport
  value: Summer shuttle buses link Odda with the lower car parks, and a second shuttle runs from P2 up to the top car park.
  source_url: https://www.trolltunga.com/en/parking-and-transport/shuttle-busses
  source_title: Shuttle buses to Trolltunga | Trolltunga official website
  publisher: Trolltunga official website (trolltunga.com)
  checked_at: '2026-11-15'
  evidence_heading: Shuttle buses to Trolltunga
  evidence:
    page: P3
    quote: There are shuttle buses between Odda, P1 Tyssedal and P2 Skjeggedal. From P2 Skjeggedal you can take a second bus up to P3 Mågelitopp, the uppermost parking lot.
  verified: true
