  evidence_heading: Weather conditions
  evidence:
    page: P1
    quote: Fiordland National Park experiences high rainfall (up to 9,000 mm per year) and weather conditions can change quickly in any season. Cold temperatures, snow, strong winds and heavy rain can occur at any time of the year.
  verified: true
- field: hazard
  value:
    type: avalanche
    note: Nine avalanche paths, most able to reach the track, so avalanches are frequent in the cold season.
  note: Avalanche terrain on the tops.
