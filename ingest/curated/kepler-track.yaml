- field: trailhead_access
  value: The Kepler Track car park is about 5 km from Te Anau on the Manapouri-Te Anau Highway, then Golf Course Road; walkers can follow the track from the Visitor Centre.
  note: Access to the main trailhead.
  source_url: https://www.doc.govt.nz/parks-and-recreation/places-to-go/fiordland/places/fiordland-national-park/things-to-do/tracks/kepler-track-carpark-to-luxmore-hut/
  source_title: 'Kepler Track: Carpark to Luxmore Hut: Fiordland National Park, Fiordland region'
  publisher: Department of Conservation
  checked_at: 2026-11-15
  evidence:
    page: P5
    quote: 'This track begins from the Kepler Track carpark, which is at the southern end of Lake Te Anau, about 5 km from Te Anau. Private transport: Follow the Manapouri - Te Anau Highway for about 2 km, turn right onto Golf Course Road for another 1.8 km and the carpark is signposted on the right.'
  verified: true
- field: public_transport
  value: Transport between Te Anau and the track ends can be booked in the Great Walks season; otherwise it is a 50 minute walk.
  note: Transfers apply in the Great Walks season.
