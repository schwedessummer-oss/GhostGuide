    source_title: Laws & Policies - Zion National Park (U.S. National Park Service)
    publisher: National Park Service
    checked_at: 2026-11-15
    evidence_heading: Aircraft-based Remote-controlled Equipment

  - field: rule_camping
    value: { value: restricted, note: "Camping only in designated campground sites, or in designated wilderness areas with a Wilderness Permit; overnighting in road pullouts or car parks is prohibited." }
    source_url: https://www.nps.gov/zion/learn/management/lawsandpolicies.htm
    source_title: Laws & Policies - Zion National Park (U.S. National Park Service)
    publisher: National Park Service
    checked_at: 2026-11-15
    evidence_heading: Camping

  - field: hazard
    value: { type: exposure, note: "The last half mile follows a knife-edge ridge with a single chain to hold; most fatal accidents since 1930 happened here. Do not go up when rock is wet or icy, in the dark, or if you fear heights." }
    source_url: https://www.nps.gov/zion/planyourvisit/angels-landing-hiking-permits.htm
    source_title: Angels Landing Permits & Hiking - Zion National Park (U.S. National Park Service)
    publisher: National Park Service
    checked_at: 2026-11-15
    evidence_heading: Use caution on the Angels Landing Chains

  - field: hazard
    value: { type: lightning, note: "Being on the ridge in rain or thunderstorms is dangerous; storms are more common in the afternoon. Stop climbing and head down if storm clouds approach." }
    source_url: https://www.nps.gov/zion/planyourvisit/angels-landing-hiking-permits.htm
    source_title: Angels Landing Permits & Hiking - Zion National Park (U.S. National Park Service)
    publisher: National Park Service
    checked_at: 2026-11-15
    evidence_heading: Check the weather forecast

  - field: hazard
    value: { type: rockfall, note: "Rockfall can happen at any time, especially near cliff faces. Move away from the cliff base, or shelter behind a large boulder with your pack over your head." }
    source_url: https://www.nps.gov/zion/planyourvisit/angels-landing-hiking-permits.htm
    source_title: Angels Landing Permits & Hiking - Zion National Park (U.S. National Park Service)
    publisher: National Park Service
    checked_at: 2026-11-15
    evidence_heading: Be mindful of conditions

  - field: hazard
    value: { type: heat, note: "Summer daytime highs in Zion Canyon often pass 100 F (38 C), and late-summer monsoon storms raise flash flood risk; check the forecast before setting out." }
