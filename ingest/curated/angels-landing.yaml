  - field: parking
    value: "Park lots inside Zion often fill early. Paid parking is available in Springdale, from where the free Springdale Line shuttle reaches the park's pedestrian entrance."
    source_url: https://www.nps.gov/zion/planyourvisit/zion-canyon-shuttle-system.htm
    source_title: Zion Canyon Shuttle System - Zion National Park (U.S. National Park Service)
    publisher: National Park Service
    checked_at: 2026-11-15
    evidence_heading: How to Use the Shuttle System

  - field: trailhead_access
    value: "Most of the year the trailhead is reachable only by park shuttle from the Zion Canyon Visitor Center; most hikers begin at The Grotto, Shuttle Stop 6. In the few winter and spring weeks without shuttles you may drive and park on pavement."
    source_url: https://www.nps.gov/zion/planyourvisit/angels-landing-hiking-permits.htm
    source_title: Angels Landing Permits & Hiking - Zion National Park (U.S. National Park Service)
    publisher: National Park Service
    checked_at: 2026-11-15
    evidence_heading: Get to the trailhead

  - field: public_transport
    value: "Free park shuttles need no ticket. The Zion Canyon Line links the visitor center with 9 stops including The Grotto; the Springdale Line serves the town. Most years they run daily March-November and over the late-December holidays."
    source_url: https://www.nps.gov/zion/planyourvisit/zion-canyon-shuttle-system.htm
    source_title: Zion Canyon Shuttle System - Zion National Park (U.S. National Park Service)
    publisher: National Park Service
    checked_at: 2026-11-15
    evidence_heading: What to Expect When Shuttles Are Running

  - field: rule_dogs
    value: { value: not_allowed, note: "Pets are barred from all park trails except the Pa'rus Trail, from wilderness and from shuttles; service animals excepted." }
    source_url: https://www.nps.gov/zion/planyourvisit/pets.htm
    source_title: Pets - Zion National Park (U.S. National Park Service)
    publisher: National Park Service
    checked_at: 2026-11-15
    evidence_heading: Know Where You Can Go

  - field: rule_drones
    value: { value: not_allowed, note: "Drones and other remote-controlled aircraft may not be used anywhere in the park." }
