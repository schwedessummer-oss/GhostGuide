  - field: season_note
    value: "Listed as a year-round hike that can be done at day, dawn or dusk. Permit lotteries run for every season of the year."
    source_url: https://www.nps.gov/thingstodo/hike-angels-landing.htm
    source_title: Angels Landing (U.S. National Park Service)
    publisher: National Park Service
    checked_at: 2026-11-15
    evidence_heading: Season

  - field: permit_required
    value: "yes"
    note: "Every hiker going past Scout Lookout onto the chains section needs a permit. The West Rim Trail up to Scout Lookout needs none. Rangers may check permits and ID anywhere on the trail."
    source_url: https://www.nps.gov/zion/planyourvisit/angels-landing-hiking-permits.htm
    source_title: Angels Landing Permits & Hiking - Zion National Park (U.S. National Park Service)
    publisher: National Park Service
    checked_at: 2026-11-15
    evidence_heading: Angels Landing Pilot Permit Program

  - field: permit
    value:
      name: Angels Landing permit (seasonal lottery)
      kind: lottery
      how_to_apply: "Apply on Recreation.gov during the window for your season, ranking up to seven preferred days and times. Up to 6 people can go on one application. Keep a printed or saved copy of the confirmation email, which serves as the permit."
      booking_window: "Hikes 1 Mar-31 May: apply 1-20 Jan; 1 Jun-31 Aug: apply 1-20 Apr; 1 Sep-30 Nov: apply 1-20 Jul; 1 Dec-28 Feb: apply 1-20 Oct (opens 8 am MT, closes 11:59 pm MT; permits issued on the 25th)"
      official_url: https://www.recreation.gov/permits/4675326
      price: { amount: 6.00, currency: USD, unit: per_application, audience: all, note: "non-refundable; plus $3 per person if a permit is awarded" }
    note: "Seasonal permits can be cancelled or reduced in size until two days before the hike for a refund of the per-person fee; dates, group increases and transfers are not allowed."
    source_url: https://www.nps.gov/zion/planyourvisit/angels-landing-hiking-permits.htm
    source_title: Angels Landing Permits & Hiking - Zion National Park (U.S. National Park Service)
    publisher: National Park Service
    checked_at: 2026-11-15
    evidence_heading: Seasonal Lottery

  - field: permit
    value:
      name: Angels Landing permit (day-before lottery)
      kind: lottery
      how_to_apply: "Apply on Recreation.gov the day before your hike; every application in the window has equal odds. One application covers up to 6 people. Results come by email after 4 pm."
      booking_window: "Day before the hike, 12:01 am to 3 pm Mountain Time"
      official_url: https://www.recreation.gov/permits/4675325
      price: { amount: 6.00, currency: USD, unit: per_application, audience: all, note: "non-refundable; plus $3 per person if a permit is awarded" }
    note: "Day-before permits cannot be changed and no fees are refunded."
    source_url: https://www.nps.gov/zion/planyourvisit/angels-landing-hiking-permits.htm
    source_title: Angels Landing Permits & Hiking - Zion National Park (U.S. National Park Service)
    publisher: National Park Service
    checked_at: 2026-11-15
    evidence_heading: Day-before Lottery

