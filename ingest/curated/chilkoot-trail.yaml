  - field: trailhead_access
    value: "The southern (US) trailhead is reached by road, just north of the old Dyea townsite about 10 mi (16 km) from Skagway; arrange your ride to it in advance."
    source_url: https://www.nps.gov/klgo/planyourvisit/planning-your-hike.htm
    source_title: Planning Your Hike_CB - Klondike Gold Rush National Historical Park (U.S. National Park Service)
    publisher: National Park Service
    checked_at: 2026-11-15
    evidence_heading: Chilkoot Trailhead

  - field: trailhead_access
    value: "Bennett, the northern trailhead, has no road: you arrive or leave by train, air taxi or boat, booked with the carrier ahead of time. Walking the railway is illegal, and there is no cell signal, so bring a satellite messenger."
    source_url: https://www.nps.gov/klgo/planyourvisit/planning-your-hike.htm
    source_title: Planning Your Hike_CB - Klondike Gold Rush National Historical Park (U.S. National Park Service)
    publisher: National Park Service
    checked_at: 2026-11-15
    evidence_heading: Bennett

  - field: parking
    value: "Anyone leaving a vehicle in Dyea has to use the Chilkoot Trailhead parking area."
    source_url: https://www.nps.gov/klgo/planyourvisit/planning-your-hike.htm
    source_title: Planning Your Hike_CB - Klondike Gold Rush National Historical Park (U.S. National Park Service)
    publisher: National Park Service
    checked_at: 2026-11-15
    evidence_heading: Arriving to the Chilkoot Trailhead

  - field: public_transport
    value: "Bennett is served only by the White Pass and Yukon Route railway (1-800-343-7373), floatplane firms (Alkan Air, Alpine Aviation, Amber Airways) or boat; book with the carrier directly and carry a satellite device to reach them at the end."
    source_url: https://parks.canada.ca/lhn-nhs/yt/chilkoot/activ/randonnee-cdn-hiking
    source_title: Hike the Canadian side - Chilkoot Trail National Historic Site
    publisher: Parks Canada
    checked_at: 2026-11-15
    evidence_heading: Getting to and from Bennett

  - field: rule_dogs
    value: { value: restricted, note: "Parks Canada advises leaving pets at home. Any pet must stay leashed at all times, keep out of cooking shelters, and have its food locked in the bear boxes." }
    source_url: https://parks.canada.ca/lhn-nhs/yt/chilkoot/visit/regles-rules/conditions
    source_title: Permit conditions - Chilkoot Trail National Historic Site
    publisher: Parks Canada
    checked_at: 2026-11-15
    evidence_heading: 7. Pets must be on a leash at all times

  - field: rule_drones
    value: { value: not_allowed, note: "Recreational drone use is banned in national parks and historic sites in Yukon and northern BC, which includes the Canadian part of the trail; special permits are only for research or filming." }
    source_url: https://parks.canada.ca/lhn-nhs/yt/chilkoot/visit/regles-rules/aeronefs-aircraft
    source_title: Flying in and around national parks and historic sites in Yukon and northern British Columbia - Chilkoot Trail National Historic Site
    publisher: Parks Canada
    checked_at: 2026-11-15
