  - field: distance_km
    value: 53
    basis: one_way
    note: "NPS gives 33 mi (53 km) from Dyea, Alaska, to Bennett, BC, with Chilkoot Pass (the border) about halfway. The full one-way distance cannot be hiked in 2026 because the border crossing is closed."
    source_url: https://www.nps.gov/klgo/planyourvisit/planning-your-hike.htm
    source_title: Planning Your Hike_CB - Klondike Gold Rush National Historical Park (U.S. National Park Service)
    publisher: National Park Service
    checked_at: 2026-11-15
    evidence_heading: Trail Information for 2026

  - field: elevation_gain_m
    value: 1000
    note: "NPS states about 3,500 ft (1,000 m) of gain over the whole trail; the metric figure is the one the page prints (3,500 ft x 0.3048 would be about 1,067 m)."
    source_url: https://www.nps.gov/klgo/planyourvisit/planning-your-hike.htm
    source_title: Planning Your Hike_CB - Klondike Gold Rush National Historical Park (U.S. National Park Service)
    publisher: National Park Service
    checked_at: 2026-11-15
    evidence_heading: Trail Information for 2026

  - field: route_type
    value: point_to_point
    note: "The trail runs from the road-accessible Chilkoot Trailhead near Dyea to Bennett, which has no road. For 2026 hikers must turn around at the border, so any trip is an out-and-back from one end."
    source_url: https://www.nps.gov/klgo/planyourvisit/planning-your-hike.htm
    source_title: Planning Your Hike_CB - Klondike Gold Rush National Historical Park (U.S. National Park Service)
    publisher: National Park Service
    checked_at: 2026-11-15
    evidence_heading: Trail Information for 2026

  - field: season_note
    value: "Summer season runs June to mid-September. Early June means snow travel and likely snow camping, avalanche risk below the pass lasts to mid-July, mid-July to early August is mostly snow-free and busiest, and late season brings more fog and freezing nights."
    source_url: https://parks.canada.ca/lhn-nhs/yt/chilkoot/activ/randonnee-cdn-hiking
    source_title: Hike the Canadian side - Chilkoot Trail National Historic Site
    publisher: Parks Canada
    checked_at: 2026-11-15
    evidence_heading: Hiking season

  - field: permit_required
    value: seasonal
    note: "Permits and reservations are needed from 1 June to 12 September. Shoulder-season permits cover 15 April-31 May and 13 September-31 October; no permit is needed from 1 November to 15 April."
    source_url: https://parks.canada.ca/lhn-nhs/yt/chilkoot/visit/permis-permits
    source_title: Permits and reservations - Chilkoot Trail National Historic Site
    publisher: Parks Canada
    checked_at: 2026-11-15
    evidence_heading: Permits and reservations

  - field: permit
    value:
      name: Chilkoot Trail overnight permit (Canadian side)
      kind: overnight
      how_to_apply: "Reserve through the Parks Canada Reservation Service. Every hiker must then attend an in-person orientation within 2 days of the hike (in Whitehorse for Canadian-side trips, booked by phone on 867-333-0775), where the permit is issued."
      booking_window: "Reservations can be made, changed or cancelled until 11:59 pm two days before arrival; Canadian-side reservations are closed for the current season"
      official_url: https://parks.canada.ca/lhn-nhs/yt/chilkoot/visit/permis-permits
      months: [6, 7, 8, 9]
    note: "Permit fees are fully refunded up to 21 days before the start and half refunded after that; reservation fees are never refunded. Commercial guides, outfitters and youth groups book by email (chilkootinfo@pc.gc.ca)."
    source_url: https://parks.canada.ca/lhn-nhs/yt/chilkoot/visit/permis-permits
    source_title: Permits and reservations - Chilkoot Trail National Historic Site
    publisher: Parks Canada
    checked_at: 2026-11-15
    evidence_heading: Reservations

  - field: permit
    value:
      name: Chilkoot Trail overnight permit (US side)
      kind: overnight
      how_to_apply: "Pick campgrounds and dates on Recreation.gov and print the permit, then have it validated at the Trail Center in Skagway (Broadway between 5th and 6th Avenues), where every group member attends a mandatory safety orientation of about 30 minutes. One permit covers the group."
      official_url: https://www.nps.gov/klgo/planyourvisit/planning-your-hike.htm
      months: [6, 7, 8, 9]
    note: "Required 1 June-12 September for all overnight users; camping only in designated campgrounds. The US-side permit fee is non-refundable. Trail runners collect their permit a day ahead or before noon on the start day."
    source_url: https://www.nps.gov/klgo/planyourvisit/planning-your-hike.htm
    source_title: Planning Your Hike_CB - Klondike Gold Rush National Historical Park (U.S. National Park Service)
    publisher: National Park Service
    checked_at: 2026-11-15
    evidence_heading: Reserve your permit

  - field: permit
    value:
      name: Chilkoot Trail day-use permit (Canadian side)
      kind: day_use
      how_to_apply: "Contact Parks Canada for a permit. From 15 April to 31 October all day use in the historic site needs one, except at the Log Cabin parking lot and in the Bennett area."
      official_url: https://parks.canada.ca/lhn-nhs/yt/chilkoot/securite-safety/bulletins/0F0A11D7-F1D1-4EBE-8531-AFAD1EA15388
      months: [4, 5, 6, 7, 8, 9, 10]
    note: "Set by the Summer restricted activity order issued 30 April 2026, which also makes all overnight travel and camping permit-only. Permits are free 15 April-31 May and 14 September-31 October; a fee applies 1 June-13 September."
    source_url: https://parks.canada.ca/lhn-nhs/yt/chilkoot/securite-safety/bulletins/0F0A11D7-F1D1-4EBE-8531-AFAD1EA15388
