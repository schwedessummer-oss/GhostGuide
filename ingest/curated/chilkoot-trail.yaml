  - field: rule_camping
    value: { value: restricted, note: "Designated campgrounds only, named night by night in your reservation along with the number of tent sites (plan on at least two hikers per site). No camping at Chilkoot Pass." }
    source_url: https://parks.canada.ca/lhn-nhs/yt/chilkoot/activ/randonnee-cdn-hiking
    source_title: Hike the Canadian side - Chilkoot Trail National Historic Site
    publisher: Parks Canada
    checked_at: 2026-11-15
    evidence_heading: Choosing your campgrounds

  - field: rule_fires
    value: { value: not_allowed, note: "No open fires anywhere on the trail; bring a stove. Some shelters below treeline have wood stoves: on the US side only dead and down wood may be gathered, on the Canadian side wood is supplied and collecting it is banned." }
    source_url: https://parks.canada.ca/lhn-nhs/yt/chilkoot/visit/regles-rules/conditions
    source_title: Permit conditions - Chilkoot Trail National Historic Site
    publisher: Parks Canada
    checked_at: 2026-11-15
    evidence_heading: 6. No campfires

  - field: hazard
    value: { type: avalanche, note: "The slope between Happy Camp and Chilkoot Pass is avalanche terrain until mid-July. Cross early in the day, avoid the afternoon, never rest below avalanche signs, and move through one at a time with gaps." }
    source_url: https://parks.canada.ca/lhn-nhs/yt/chilkoot/securite-safety/ete-summer
    source_title: Trail Hazards - Chilkoot Trail National Historic Site
    publisher: Parks Canada
    checked_at: 2026-11-15
    evidence_heading: Avalanche hazard

  - field: hazard
    value: { type: weather, note: "Above treeline, between Deep Lake and the pass, expect cold, wet, windy or whiteout conditions; heavy rain or snowstorms can arrive even in midsummer, and fog often cuts visibility." }
    source_url: https://parks.canada.ca/lhn-nhs/yt/chilkoot/securite-safety/ete-summer
    source_title: Trail Hazards - Chilkoot Trail National Historic Site
    publisher: Parks Canada
    checked_at: 2026-11-15
    evidence_heading: Travel conditions

  - field: hazard
    value: { type: other, note: "Snowfields and route finding: between Happy Camp and the pass the way is an unmarked route that can stay snow-covered into July or all season, and snow or ice bridges over streams and rocks can give way without warning." }
    source_url: https://parks.canada.ca/lhn-nhs/yt/chilkoot/securite-safety/ete-summer
    source_title: Trail Hazards - Chilkoot Trail National Historic Site
    publisher: Parks Canada
    checked_at: 2026-11-15
    evidence_heading: Snowfields

  - field: hazard
    value: { type: river_crossing, note: "Swollen creeks may have to be waded: keep footwear on, face upstream, lean on poles or a stick and link arms if needed." }
    source_url: https://parks.canada.ca/lhn-nhs/yt/chilkoot/securite-safety/ete-summer
    source_title: Trail Hazards - Chilkoot Trail National Historic Site
    publisher: Parks Canada
    checked_at: 2026-11-15
    evidence_heading: Creek crossing

  - field: hazard
    value: { type: cold, note: "Frequent cold, wet and windy weather makes hypothermia a real danger; skip cotton and carry spare warm layers, good rain gear and a hat." }
    source_url: https://parks.canada.ca/lhn-nhs/yt/chilkoot/securite-safety/ete-summer
    source_title: Trail Hazards - Chilkoot Trail National Historic Site
    publisher: Parks Canada
    checked_at: 2026-11-15
    evidence_heading: Hypothermia

  - field: hazard
    value: { type: remoteness, note: "There is no cell coverage in the historic site, so carry a satellite device. Helicopter evacuations happen every year, and injured hikers may be billed for rescue and medical care." }
    source_url: https://parks.canada.ca/lhn-nhs/yt/chilkoot/securite-safety/ete-summer
