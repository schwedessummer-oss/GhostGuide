  - field: closure
    value: { status: partially_closed, note: "While the border stays shut, Parks Canada offers the Canadian stretch as an out-and-back: 26 km each way from Bennett to Chilkoot Pass with a moderate 450 m climb, about the full trail's length in total but with easier ascents.", as_of: 2026-11-15 }
    source_url: https://parks.canada.ca/lhn-nhs/yt/chilkoot/activ/randonnee-cdn-hiking
    source_title: Hike the Canadian side - Chilkoot Trail National Historic Site
    publisher: Parks Canada
    checked_at: 2026-11-15
