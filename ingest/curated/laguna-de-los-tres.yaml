  evidence:
    page: P4
    quote: En temporada invernal (de mayo a septiembre) las sendas presentan hielo, barro y nieve, por lo que se vuelven extremadamente complejas. Es obligatorio el uso de bastones y crampones para evitar caídas.
  verified: true
- field: hazard
  value:
    type: cold
    note: Walking or skating on frozen lagoons is banned because the ice is unstable and hypothermia is a risk.
