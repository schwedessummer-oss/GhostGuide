  evidence_heading: Avalanches will be frequent
  evidence:
    page: P1
    quote: The Routeburn Track has a lot of challenging and complex avalanche terrain. Avalanches are frequent. There are over 32 avalanche paths, some of which may bring avalanche debris to the valley floor and have the potential to cross the Routeburn Track.
  verified: true
