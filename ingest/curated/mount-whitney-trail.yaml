  - field: trailhead_access
    value: "The trail starts at Whitney Portal on the east side of the Sierra, reached by road 13 miles (21 km) west of Lone Pine."
    source_url: https://www.nps.gov/seki/planyourvisit/whitney.htm
    source_title: Seeing and Climbing Mt. Whitney - Sequoia & Kings Canyon National Parks (U.S. National Park Service)
    publisher: National Park Service
    checked_at: 2026-11-15
    evidence_heading: Trail Routes

  - field: public_transport
    value: "Eastern Sierra Transit (ESTA) runs buses between towns along Highway 395. The trailhead routes it lists are summer services near Mammoth Lakes, Reds Meadow and Bishop Creek; none is listed for Whitney Portal."
    source_url: https://www.fs.usda.gov/r05/inyo/permits/wilderness-permits
    source_title: Inyo National Forest | Wilderness Permits | Forest Service
    publisher: USDA Forest Service, Inyo National Forest
    checked_at: 2026-11-15
    evidence_heading: Local Transportation in the Eastern Sierra

  - field: rule_dogs
    value: { value: restricted, note: "Dogs under control are allowed on national forest land, but pets are banned in Sequoia National Park, and the summit lies in the park." }
    source_url: https://www.fs.usda.gov/r05/inyo/permits/wilderness-regulations
    source_title: Inyo National Forest | Wilderness Regulations | Forest Service
    publisher: USDA Forest Service, Inyo National Forest
    checked_at: 2026-11-15
    evidence_heading: Pets

  - field: rule_fires
    value: { value: not_allowed, note: "The Mt. Whitney area is on Inyo NF's list of places closed to campfires; gas or liquid-fuel stoves may be used, but not stoves burning wood or other solid fuel." }
    source_url: https://www.fs.usda.gov/r05/inyo/permits/wilderness-regulations
    source_title: Inyo National Forest | Wilderness Regulations | Forest Service
    publisher: USDA Forest Service, Inyo National Forest
    checked_at: 2026-11-15
    evidence_heading: Campfire Restrictions

  - field: rule_camping
    value: { value: restricted, note: "Overnight stays need a permit. Use existing sites at least 100 ft from trails and water; camping is banned at Mirror Lake and Trailside Meadow. Bear-resistant food storage is mandatory in the Mt. Whitney area and solid human waste must be packed out." }
    source_url: https://www.fs.usda.gov/r05/inyo/permits/wilderness-regulations
    source_title: Inyo National Forest | Wilderness Regulations | Forest Service
    publisher: USDA Forest Service, Inyo National Forest
    checked_at: 2026-11-15
    evidence_heading: Camping Restrictions

  - field: rule_group_size
    value: { value: restricted, max_group: 15, note: "Groups larger than 15 people are prohibited, even when split across separate permits." }
    source_url: https://www.fs.usda.gov/r05/inyo/permits/wilderness-regulations
    source_title: Inyo National Forest | Wilderness Regulations | Forest Service
    publisher: USDA Forest Service, Inyo National Forest
    checked_at: 2026-11-15
    evidence_heading: General Wilderness Restrictions

