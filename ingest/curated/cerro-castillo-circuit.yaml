  - field: trailhead_access
    value: The park is reached by the Carretera Austral (Ruta 7), which crosses it 64 km south of Coyhaique. Register at the park administration at Laguna Chiguay (km 57, Ruta 7 Sur) before starting any trail.
    source_url: https://www.conaf.cl/parque_nacionales/parque-nacional-cerro-castillo/
    source_title: Parque Nacional Cerro Castillo - CONAF
    publisher: Corporación Nacional Forestal (CONAF)
    checked_at: 2026-11-15
    evidence_heading: Accesos / Recomendaciones
  - field: rule_fires
    value: { value: not_allowed, note: Any heat source, including stoves and cigarettes, is banned under Ley 20.653 art. 22. }
    source_url: https://www.conaf.cl/parque_nacionales/parque-nacional-cerro-castillo/
    source_title: Parque Nacional Cerro Castillo - CONAF
    publisher: Corporación Nacional Forestal (CONAF)
    checked_at: 2026-11-15
    evidence_heading: Prohibiciones
  - field: rule_dogs
    value: { value: not_allowed, note: Pets and exotic animals may not enter the park. }
    source_url: https://www.conaf.cl/parque_nacionales/parque-nacional-cerro-castillo/
    source_title: Parque Nacional Cerro Castillo - CONAF
    publisher: Corporación Nacional Forestal (CONAF)
    checked_at: 2026-11-15
    evidence_heading: Prohibiciones
  - field: rule_drones
    value: { value: not_allowed, note: Only research or professional filming with prior CONAF authorisation. }
    source_url: https://www.conaf.cl/parque_nacionales/parque-nacional-cerro-castillo/
    source_title: Parque Nacional Cerro Castillo - CONAF
    publisher: Corporación Nacional Forestal (CONAF)
    checked_at: 2026-11-15
    evidence_heading: Prohibiciones
  - field: hazard
    value:
      type: weather
      note: Conditions change fast; the page mentions extreme cold or snow even in summer, with temperatures between -15 and 25 degrees C. Trails close in torrential rain, snow or strong wind.
    source_url: https://www.conaf.cl/parque_nacionales/parque-nacional-cerro-castillo/
    source_title: Parque Nacional Cerro Castillo - CONAF
    publisher: Corporación Nacional Forestal (CONAF)
    checked_at: 2026-11-15
    evidence_heading: Recomendaciones
  - field: hazard
    value:
      type: wildlife
      note: Rodents in the area can carry hantavirus; avoid contact with them. Huemul deer often cross the road, so drive slowly.
    source_url: https://www.conaf.cl/parque_nacionales/parque-nacional-cerro-castillo/
    source_title: Parque Nacional Cerro Castillo - CONAF
    publisher: Corporación Nacional Forestal (CONAF)
    checked_at: 2026-11-15
    evidence_heading: Senderos habilitados / Recomendaciones
  - field: nearest_town
    value: { name: Coyhaique, note: The park administration is about 57 km from Coyhaique, the nearest fuel stop the page names; lodging is also in Villa Cerro Castillo and Puerto Ingeniero Ibáñez. }
