  - field: hazard
    value: { type: exposure, note: "The Summit Trail crosses a steep scree slope and a rocky plateau with loose, uneven ground. Cliffs are unmarked and the route is hard to follow in cloud, so hikers should avoid it when the summit is clouded in; cairns mark the way across the top." }
    source_url: https://parks.canada.ca/pn-np/nl/grosmorne/activ/experiences/randonnee-hiking/mgm-gmm
    source_title: Gros Morne Mountain - Gros Morne National Park
    publisher: Parks Canada
    checked_at: 2026-11-15
    evidence_heading: Trail safety - know before you go

  - field: hazard
    value: { type: remoteness, note: "Rescue can take many hours, and mobile coverage is unreliable across the park. Parks Canada gives an emergency line of 1-877-852-3100 and advises telling someone your plan and return time." }
    source_url: https://parks.canada.ca/pn-np/nl/grosmorne/activ/experiences/randonnee-hiking/mgm-gmm
    source_title: Gros Morne Mountain - Gros Morne National Park
    publisher: Parks Canada
    checked_at: 2026-11-15
    evidence_heading: Trail safety - know before you go

  - field: hazard
    value: { type: weather, note: "The summit is often windy and much cooler than the base. By mid October frost, storms, ice and snow arrive; later in winter avalanche risk builds and the trail is hard to see." }
    source_url: https://parks.canada.ca/pn-np/nl/grosmorne/activ/experiences/randonnee-hiking/mgm-gmm
