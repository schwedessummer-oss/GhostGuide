  - field: season_note
    value: "Best from 28 June to mid October, with the most settled weather and long days, though a few snow patches can linger early on. From mid October to 30 April the Summit Trail is not recommended because of ice, snow, storms, short days and later avalanche risk."
    source_url: https://parks.canada.ca/pn-np/nl/grosmorne/activ/experiences/randonnee-hiking/mgm-gmm
    source_title: Gros Morne Mountain - Gros Morne National Park
    publisher: Parks Canada
    checked_at: 2026-11-15
    evidence_heading: When to go - seasonal hiking conditions

  - field: closure
    value: { status: seasonal, note: "The Summit Trail is closed to hikers each year from 1 May until 27 June to protect wildlife and plants; it reopens on 28 June. Hiking it while closed can lead to charges under the Canada National Parks Act.", as_of: 2026-11-15 }
    source_url: https://parks.canada.ca/pn-np/nl/grosmorne/activ/experiences/randonnee-hiking/mgm-gmm
