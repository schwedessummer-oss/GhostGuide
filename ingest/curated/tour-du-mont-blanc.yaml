- field: hazard
  value:
    type: weather
    note: Snowfields can persist on trails even early in the season; they can hide markings and be slippery,
      and snow bridges over streams can collapse. The site advises crampons, ice axe and navigation tools.
  source_url: https://www.autourdumontblanc.com/en/safety/mountain-hazards-and-equipment
  source_title: Mountain hazards and equipment - Autour du Mont-Blanc
  publisher: Fondazione Montagna Sicura (Autour du Mont-Blanc, with Espace Mont-Blanc partners)
  checked_at: '2026-11-15'
  evidence_heading: Mountain hazards / Snow and snowfields
- field: closure
  value:
    status: partially_closed
    note: Old path between Prayon and Branche (Les Treutsebo, Switzerland) is closed for rockfall risk
      and must not be used; a signposted diversion was to open on 11 July 2026. Camping and bivouacking
      are banned in that area.
