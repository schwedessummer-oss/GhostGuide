- field: rule_camping
  value:
    value: restricted
    note: Wild camping is largely banned along the route. Aosta Valley bans camping and bivouacs below
      2,500 m. Swiss Valais municipalities on the route prohibit bivouacs and allow camping only at designated
      sites. Chamonix bans camping outside designated sites and tolerates only high-altitude bivouacs
      from sunset to sunrise. Booking a pitch is mandatory in the Aiguilles Rouges nature reserves from
      1 June to 30 September.
  source_url: https://www.autourdumontblanc.com/en/accomodations/bivouac
  source_title: Bivouac and wild camping - Autour du Mont-Blanc
  publisher: Fondazione Montagna Sicura (Autour du Mont-Blanc, with Espace Mont-Blanc partners)
  checked_at: '2026-11-15'
  evidence_heading: Bivouac and wild camping
- field: hazard
  value:
    type: rockfall
    note: A Swiss section between Prayon and Branche (Treutsebo sector) was rerouted because of rockfall
      risk; the signposted new path was due to open on 11 July 2026 and the old path is closed.
  source_url: https://www.autourdumontblanc.com/en/
  source_title: Autour du Mont-Blanc
  publisher: Fondazione Montagna Sicura (Autour du Mont-Blanc, with Espace Mont-Blanc partners)
  checked_at: '2026-11-15'
  evidence_heading: 'Route diversion in the Swiss sector: path between Prayon and Branche (Treutsebo sector)'
- field: hazard
  value:
    type: lightning
    note: The site warns that storms can build quickly on hot summer days and gives guidance on seeking
      shelter away from ridges and water.
  source_url: https://www.autourdumontblanc.com/en/safety/mountain-hazards-and-equipment
