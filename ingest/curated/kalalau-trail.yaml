    value: { type: other, note: "Ocean: surf and rip currents at Hanakāpīʻai are changeable and often extremely dangerous, worst with winter high surf. Swimming or wading there is not recommended; drownings happen regularly." }
    source_url: https://dlnr.hawaii.gov/dsp/hiking/kauai/kalalau-trail/
