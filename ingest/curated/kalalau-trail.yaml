  - field: parking
    value: "Day parking at Hāʻena State Park is by advance timeslot reservation only and sells out quickly. Parking outside the park breaks the purchase terms; tickets run $200 or more and cars can be towed."
    source_url: https://gohaena.com/info-faqs/
    source_title: Info & FAQ's - Go Hāʻena
