    value: { type: remoteness, note: "There are no emergency services and no cell coverage on the Nāpali Coast; so getting help means walking out or signalling a passing boat or helicopter." }
    source_url: https://dlnr.hawaii.gov/dsp/hiking/kauai/kalalau-trail/kalalau-trail-safety-concerns/
