    value: { value: not_allowed, note: "No open fires. Do not take stones from rock walls to build fire rings or shelters; archaeological sites are protected by law." }
    source_url: https://dlnr.hawaii.gov/dsp/camping-lodging/special-permit-rules-for-napali-coast-state-park/
