    checked_at: 2026-11-15
    evidence_heading: Difficulty

  - field: season_note
    value: "Temperatures rarely fall below 60°F. May to October usually brings steady trade winds with passing showers; October to May is less predictable. Showers are most frequent at night and early morning, and occasional large storms cause flash floods."
    source_url: https://dlnr.hawaii.gov/dsp/hiking/kauai/kalalau-trail/
    source_title: Kalalau Trail – Division of State Parks
    publisher: Hawaiʻi Department of Land and Natural Resources, Division of State Parks
    checked_at: 2026-11-15
    evidence_heading: Climate & Seasons

  - field: permit_required
    value: "yes"
    note: "To use the trail you need a day-use (Hāʻena entry) reservation or a valid camping permit, plus a parking reservation to park there. Anyone going past Hanakāpīʻai Valley, 2 miles in, must hold a camping permit; without one, hiking the whole 22 miles in a day is prohibited."
    source_url: https://dlnr.hawaii.gov/dsp/hiking/kauai/kalalau-trail/
    source_title: Kalalau Trail – Division of State Parks
    publisher: Hawaiʻi Department of Land and Natural Resources, Division of State Parks
    checked_at: 2026-11-15
    evidence_heading: Permits Required

  - field: permit
    value:
      name: Nāpali Coast State Wilderness Park camping permit (Kalalau)
      kind: overnight
      how_to_apply: "Buy online through the State Parks reservation system linked from the trail page (explore.ehawaii.gov) or in person at any State Parks district office. A valid permit also gets you into Hāʻena State Park; show it on arrival."
      booking_window: "Up to 90 days in advance"
      official_url: https://explore.ehawaii.gov/Web/#!park/9
      price: { amount: 35.00, currency: USD, unit: per_night, audience: non_resident, note: "per person per night; Hawaiʻi residents pay $25 per person per night" }
    note: "Needed by anyone continuing past Hanakāpīʻai. Stays are capped at 5 nights in the park, with no 2 nights in a row at Hanakoa. Permits often sell out fast, above all in summer; guided commercial camping trips are not allowed."
    source_url: https://dlnr.hawaii.gov/dsp/hiking/kauai/kalalau-trail/
    source_title: Kalalau Trail – Division of State Parks
    publisher: Hawaiʻi Department of Land and Natural Resources, Division of State Parks
    checked_at: 2026-11-15
    evidence_heading: Camping

  - field: permit
    value:
      name: Hāʻena State Park entry reservation
      kind: day_use
      how_to_apply: "Non-residents book online at gohaena.com before arriving. It covers the day hike along the Kalalau Trail as far as Hanakāpīʻai beach and falls. Holders of a Nāpali Coast camping permit do not need one."
      booking_window: "Up to 30 days in advance"
      official_url: https://gohaena.com
      price: { amount: 5.00, currency: USD, unit: per_person, audience: non_resident, note: "Hawaiʻi residents free with a Hawaiʻi driver licence or ID; children 3 and under free" }
    note: "The park has daily visitor limits. Since 19 April 2021 non-residents who drive need both an entry and a parking reservation; parking slots are sold per timeslot. Park hours are 7:00am-7:45pm in summer (from 1 April) and 7:00am-6:45pm in winter."
    source_url: https://dlnr.hawaii.gov/dsp/parks/kauai/haena-state-park/
    source_title: Hāʻena State Park – Division of State Parks
    publisher: Hawaiʻi Department of Land and Natural Resources, Division of State Parks
    checked_at: 2026-11-15
    evidence_heading: Hāʻena State Park

  - field: permit
    value:
      name: Hāʻena State Park day parking + entry reservation
      kind: parking
      how_to_apply: "Book online on Go Hāʻena; reservation dates open at midnight HST 30 days ahead and usually sell out at once. Choose one or more timeslots; all named visitors must arrive together in one car, and adult IDs are checked."
      booking_window: "Opens 30 days before the visit at 12am HST"
      official_url: https://gohaena.com
      price: { amount: 20.00, currency: USD, unit: per_vehicle, audience: non_resident, note: "per car per timeslot, plus $5 entry per person" }
    note: "Timeslots: 6:30am-12:30pm, 12:30-5:30pm and 4:30pm-sunset. Cancellations made at least 48 hours ahead are refunded minus a 10% fee. Checking 7-8am HST may turn up cancelled spots."
    source_url: https://gohaena.com/info-faqs/
    source_title: Info & FAQ's - Go Hāʻena
