    value: { type: exposure, note: "Parts of the trail are narrow with steep drop-offs, and roots, rocks and mud make it uneven or slippery. Wear suitable footwear." }
    source_url: https://dlnr.hawaii.gov/dsp/hiking/kauai/kalalau-trail/kalalau-trail-safety-concerns/
