    checked_at: 2026-11-15
    evidence_heading: Reservation Options

  - field: permit
    value:
      name: Hāʻena State Park overnight parking (Kalalau campers)
      kind: parking
      how_to_apply: "Only for Kalalau camping-permit holders: reserve on Go Hāʻena after getting the camping permit, entering its confirmation number, and pay for every day the car is in the lot (one night needs 2 days)."
      booking_window: "Released 90 days in advance"
      official_url: https://gohaena.com/overnight-parking-park-entry/
    note: "The Hāʻena lot is under construction with fewer spaces. Campers may also be dropped off or use the shuttle; Miloliʻi permits do not include Hāʻena entry."
