  - field: parking
    value: "Overnight parking in the Hāʻena lot is only for Kalalau permit holders and is bought separately; the lot is under construction with reduced space. Two private overnight options (Wainiha Country Market, The Cliffs at Princeville) are listed, transport not included."
    source_url: https://gohaena.com/overnight-parking-park-entry/
    source_title: Overnight Camping Parking - Go Hāʻena
    publisher: Go Hāʻena (Hāʻena State Park access system, run under an agreement with Hawaiʻi State Parks)
