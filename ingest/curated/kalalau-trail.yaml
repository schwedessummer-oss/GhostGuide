  - field: trailhead_access
    value: "The trailhead is inside Hāʻena State Park at the northwest end of Kūhiō Highway (Route 56), about 41 miles or 1.5 hours by car from Līhuʻe Airport. All access to the trail passes through Hāʻena State Park."
    source_url: https://dlnr.hawaii.gov/dsp/hiking/kauai/kalalau-trail/
    source_title: Kalalau Trail – Division of State Parks
    publisher: Hawaiʻi Department of Land and Natural Resources, Division of State Parks
    checked_at: 2026-11-15
    evidence_heading: Location

  - field: trailhead_access
    value: "From the Hāʻena parking lot or shuttle drop-off it is a 0.33-mile walk to Kēʻē Beach and the Kalalau trailhead. Download your reservation beforehand: there is no cell service."
    source_url: https://gohaena.com/conditions/
    source_title: Park Conditions - Go Hāʻena
    publisher: Go Hāʻena (Hāʻena State Park access system, run under an agreement with Hawaiʻi State Parks)
    checked_at: 2026-11-15
    evidence_heading: Plan Your Visit

  - field: public_transport
    value: "A reservable round-trip shuttle (park entry included) runs daily, with the last pickup at the park at 5:40pm; it departs from Waipā Park & Ride or Princeville, and Waipā is the only stop where riders may park. Ticket holders must ride the shuttle and board at the stop they booked."
    source_url: https://gohaena.com/info-faqs/
    source_title: Info & FAQ's - Go Hāʻena
    publisher: Go Hāʻena (Hāʻena State Park access system, run under an agreement with Hawaiʻi State Parks)
    checked_at: 2026-11-15
    evidence_heading: Shuttle Information

  - field: public_transport
    value: "The Kauaʻi Bus serves Hanalei; its stop is 0.6 miles from the Waipā Park & Ride shuttle stop. There is no bus service on Sundays."
    source_url: https://gohaena.com/conditions/
    source_title: Park Conditions - Go Hāʻena
    publisher: Go Hāʻena (Hāʻena State Park access system, run under an agreement with Hawaiʻi State Parks)
    checked_at: 2026-11-15
    evidence_heading: Useful Links

  - field: rule_camping
    value: { value: restricted, note: "Permits are issued for Kalalau only and are also valid at Hanakoa; those are the only two places to camp on the trail. Maximum 5 consecutive nights, never 2 nights running at Hanakoa. No camping on the helicopter landing pads." }
    source_url: https://dlnr.hawaii.gov/dsp/camping-lodging/special-permit-rules-for-napali-coast-state-park/
