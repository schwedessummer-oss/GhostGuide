slug: highline-trail-glacier
deleted_facts:
- field: distance_km
  value: 19.0
  basis: one_way
  note: The park gives 11.8 miles (19 km) one way from Logan Pass to The Loop. Side trips to Grinnell Glacier Overlook, Swiftcurrent Lookout or Granite Park Chalet change the distance.
  source_url: https://www.nps.gov/places/highline-trailhead.htm
  evidence_heading: Highline Trailhead
- field: season_note
  value: Trails over high passes and along the Continental Divide are normally snow-free only by late July.
  source_url: https://www.nps.gov/glac/planyourvisit/hikingthetrails.htm
  evidence_heading: Trail Status
- field: permit_required
  value: seasonal
  note: In the 2026 summer pilot (1 July to 7 September) Logan Pass parking was capped at three hours, and the park said hikers doing longer day hikes from Logan Pass, such as the Highline, needed a Logan Pass Shuttle ticket.
  source_url: https://www.nps.gov/glac/planyourvisit/visiting-loganpass-2026.htm
  evidence_heading: Timed Parking at Logan Pass
- field: permit
  value:
    name: Logan Pass Shuttle ticket (2026 pilot)
    kind: other
    how_to_apply: Book on Recreation.gov (website or app) or by phone at 877-444-6777; each ticket is for one person aged 2 or over and is tied to a date, boarding time and boarding stop. Tickets are not sold in the park and cannot be transferred.
    booking_window: Part of the tickets released 60 days ahead on a rolling basis from 2 May 2026 at 8 a.m. MDT; the rest released daily at 7 p.m. MDT for the next day, from 30 June
    official_url: https://www.nps.gov/glac/planyourvisit/shuttle-service-2026.htm
    price:
      amount: 1.0
      currency: USD
      unit: per_person
      audience: all
      note: non-refundable Recreation.gov processing fee per ticket; under-2s ride on an adult's lap without a ticket
    months:
    - 7
    - 8
    - 9
  note: Shuttles ran 1 July to 7 September 2026 from Apgar Visitor Center, Lake McDonald Lodge, St. Mary Visitor Center and Rising Sun Picnic Area. The park says the ticketed shuttle and timed parking do not continue after Labor Day 2026.
  source_url: https://www.nps.gov/glac/planyourvisit/visiting-loganpass-2026.htm
  evidence_heading: How do I get tickets and where can I find more information about the Logan Pass Shuttle?
- field: permit
  value:
    name: Logan Pass parking permit (2026 timed parking)
    kind: parking
    how_to_apply: Find a free space first, then take a free time-stamped permit from the kiosk in the Logan Pass lot and leave it on the dashboard; the stay is limited to three hours.
    booking_window: Taken from the kiosk on arrival, after parking
    official_url: https://www.nps.gov/glac/planyourvisit/visiting-loganpass-2026.htm
    price:
      amount: 0.0
      currency: USD
      unit: per_vehicle
      audience: all
      note: free
    months:
    - 7
    - 8
    - 9
  note: Applied 1 July to 7 September 2026, around the clock. The park says three hours suits shorter visits such as Hidden Lake Overlook and told Highline hikers to use the shuttle instead.
  source_url: https://www.nps.gov/glac/planyourvisit/visiting-loganpass-2026.htm
  evidence_heading: Before heading to Logan Pass, review the following details. Know what to expect and be prepared.
- field: fee
  value:
    name: Private vehicle entrance pass
    amount: 35.0
    currency: USD
    unit: per_vehicle
    audience: all
    note: Covers everyone in one private, non-commercial vehicle for seven days. Winter rate is $25.00 from 1 November to 30 April. The park takes no cash.
  source_url: https://www.nps.gov/glac/planyourvisit/fees.htm
  evidence_heading: Private Vehicle
- field: fee
  value:
    name: Per-person entrance pass (on foot or bicycle)
    amount: 20.0
    currency: USD
    unit: per_person
    audience: all
    note: Valid seven days; children under 16 need no pass. Winter rate is $15.00 from 1 November to 30 April.
  source_url: https://www.nps.gov/glac/planyourvisit/fees.htm
  evidence_heading: Per Person
- field: fee
  value:
    name: Motorcycle entrance pass
    amount: 30.0
    currency: USD
    unit: per_vehicle
    audience: all
    note: Valid 7 days for up to 2 private motorcycles carrying up to 4 people. Winter rate is $20.00 from 1 November to 30 April.
  source_url: https://www.nps.gov/glac/planyourvisit/fees.htm
  evidence_heading: Motorcycle
- field: fee
  value:
    name: Glacier annual pass
    amount: 70.0
    currency: USD
    unit: per_vehicle
    audience: resident
    note: For US citizens and residents; valid for 12 months counted from the month of entry, for the holder and passengers in one private vehicle, or the holder's immediate family when on foot or bicycle.
  source_url: https://www.nps.gov/glac/planyourvisit/fees.htm
  evidence_heading: Annual Entrance - Park
- field: fee
  value:
    name: Nonresident fee
    amount: 100.0
    currency: USD
    unit: per_person
    audience: non_resident
    note: Extra charge for each non-US resident aged 16 or older on top of the standard entrance fee; waived for holders of an Annual or America the Beautiful pass. People on commercial tours pay it too.
  source_url: https://www.nps.gov/glac/planyourvisit/fees.htm
  evidence_heading: Nonresident Fees
- field: parking
  value: Logan Pass parking had a three-hour limit from 1 July to 7 September 2026 (free kiosk permit on the dashboard). Overnight parking there is only for backcountry permit holders and Granite Park Chalet guests.
  source_url: https://www.nps.gov/glac/planyourvisit/visiting-loganpass-2026.htm
  evidence_heading: Timed Parking at Logan Pass
- field: trailhead_access
  value: The trailhead sits on the opposite side of Going-to-the-Sun Road from the Continental Divide sign, next to the Logan Pass parking lot. The park warns that parking at one end and finishing at the other takes extra logistics.
  source_url: https://www.nps.gov/places/highline-trailhead.htm
  evidence_heading: Highline Trailhead
- field: trailhead_access
  value: Going-to-the-Sun Road is normally fully open no earlier than late June, and its alpine section usually shuts around the third Monday of October. Vehicles over 21 ft long or 8 ft wide are banned between Avalanche Creek and Rising Sun.
  source_url: https://www.nps.gov/glac/planyourvisit/directions.htm
  evidence_heading: When does Going-to-the-Sun Road open and close?
- field: trailhead_access
  value: No vehicle reservations were needed anywhere in the park in 2026, including Going-to-the-Sun Road; cars may be turned away at entrances for a while when areas get too crowded.
  source_url: https://www.nps.gov/glac/planyourvisit/visiting-loganpass-2026.htm
  evidence_heading: Vehicle Reservations Not Required in 2026
- field: public_transport
  value: In 2026 a ticket-only express shuttle (1 Jul-7 Sep) ran to Logan Pass from Apgar, Lake McDonald Lodge, St. Mary and Rising Sun, with pick-ups at The Loop from late morning for Highline hikers. Last runs left Logan Pass at 7:30 pm (west) and 8 pm (east).
  source_url: https://www.nps.gov/glac/planyourvisit/shuttle-service-2026.htm
  evidence_heading: The Loop Shuttle Stop
- field: public_transport
  value: Amtrak's Empire Builder calls at West Glacier all year (and seasonally at East Glacier Park); a paid, reservation-only summer shuttle by Glacier National Park Lodges links the West Glacier depot with Apgar and Lake McDonald Lodge.
  source_url: https://www.nps.gov/glac/planyourvisit/directions.htm
  evidence_heading: How do I get to Glacier National Park?
- field: rule_dogs
  value:
    value: not_allowed
    note: Pets are barred from all trails and the backcountry; they may only go in developed areas such as roads, parking lots and frontcountry campgrounds, on a leash of 6 ft or less.
  source_url: https://www.nps.gov/glac/planyourvisit/pets.htm
  evidence_heading: Pets
- field: rule_drones
  value:
    value: not_allowed
    note: The park bans public use of drones and other unmanned aircraft, including take-off and landing.
  source_url: https://www.nps.gov/glac/learn/management/lawsandpolicies.htm
  evidence_heading: Unmanned Aircraft
- field: rule_camping
  value:
    value: restricted
    note: Any overnight camping in the park needs a wilderness use permit, booked in advance on Recreation.gov or as a walk-up permit at a permit office.
  source_url: https://www.nps.gov/glac/planyourvisit/how-to-wilderness-permit.htm
  evidence_heading: Advance vs. Walk-up Permits
- field: rule_fires
  value:
    value: restricted
    note: Fires only in built fire rings or grates at campgrounds, picnic areas and the backcountry campgrounds that allow them; the Granite Park backcountry campground is on the no-fire list.
  source_url: https://www.nps.gov/glac/learn/management/compendium.htm
  evidence_heading: Section 2.13 (Fires)
- field: hazard
  value:
    type: exposure
    note: Long stretches of the trail are exposed, so a fall is more likely and bad weather hits harder than on sheltered trails.
  source_url: https://www.nps.gov/places/highline-trailhead.htm
  evidence_heading: Highline Trailhead
- field: hazard
  value:
    type: wildlife
    note: The park is home to nearly 1,000 grizzly and black bears. Stay at least 100 yards (91 m) from bears and wolves, carry bear spray within reach, make noise and hike in a group; the park has no record of an attack on a party of four or more.
  source_url: https://www.nps.gov/glac/planyourvisit/safety.htm
  evidence_heading: What if I encounter a bear?
- field: hazard
  value:
    type: weather
    note: Mountain weather changes fast; at high spots such as Logan Pass expect colder and harsher conditions than lower in the park.
  source_url: https://www.nps.gov/glac/planyourvisit/conditions.htm
  evidence_heading: Weather
- field: hazard
  value:
    type: other
    note: 'Snow: in early season, steep snowfields and snow bridges linger at high elevations and an ice axe is often advised; from September, new snow can again cover routes.'
  source_url: https://www.nps.gov/glac/planyourvisit/trailstatusreports.htm
  evidence_heading: Trail Status Summary
- field: closure
  value:
    status: seasonal
    note: 'Seasonal road closure in force: Going-to-the-Sun Road is shut at Avalanche Creek (west side) and Jackson Glacier Overlook (east side); the open stretches can change with winter weather.'
    as_of: 2026-11-15
  source_url: https://www.nps.gov/glac/park-alerts-glac.json
  evidence_heading: Going-to-the-Sun Road Seasonal Closure
- field: access_mode
  value: independent
  note: The park expects hikers to plan their own trips; ranger-led hikes and a guide service (Glacier Guides) are listed for anyone who wants company.
  source_url: https://www.nps.gov/glac/planyourvisit/hikingthetrails.htm
  evidence_heading: Hiking the Trails
