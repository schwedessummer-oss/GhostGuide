- field: rule_fires
  value:
    value: not_allowed
    note: No fires in Zona Norte; only gas stoves in approved camping areas under supervision.
  source_url: https://www.argentina.gob.ar/parquesnacionales/patagonia-austral/recomendaciones-para-visitar-el-parque-nacional-los-glaciares
  evidence_heading: Recomendaciones para la Zona Norte del Parque Nacional
- field: rule_camping
  value:
    value: restricted
    note: The De Agostini, Capri and Poincenot campsites are run by the Asociación Amigos del Parque Nacional Los Glaciares and need a reservation.
  source_url: https://www.argentina.gob.ar/parquesnacionales/patagonia-austral/recomendaciones-para-visitar-el-parque-nacional-los-glaciares
  evidence_heading: Recomendaciones para la Zona Norte del Parque Nacional
- field: hazard
  value:
    type: cold
    note: From May to September trails carry ice, mud and snow and become extremely difficult; poles and crampons are required. Walking or skating on frozen lagoons is banned.
  source_url: https://www.argentina.gob.ar/parquesnacionales/patagonia-austral/recomendaciones-para-visitar-el-parque-nacional-los-glaciares
  evidence_heading: Recomendaciones para la Zona Norte del Parque Nacional
- field: hazard
  value:
    type: weather
    note: Weather can change at any moment in any season; check road and trail status
    and expect weak or no mobile signal in some sectors.: null
  source_url: https://www.argentina.gob.ar/parquesnacionales/patagonia-austral/recomendaciones-para-visitar-el-parque-nacional-los-glaciares
  evidence_heading: Recomendaciones generales
- field: hazard
  value:
    type: remoteness
    note: There are no shops on the trails, so carry water, food, warm layers and a torch, and plan to be back in town before dark; APN advises walking with a companion.
  source_url: https://www.argentina.gob.ar/parquesnacionales/patagonia-austral/recomendaciones-para-visitar-el-parque-nacional-los-glaciares
  evidence_heading: Recomendaciones para la Zona Norte del Parque Nacional
- field: trailhead_access
  value: Zona Norte services and trails all start from the town of El Chaltén, which is 95 km of paved road via RP 41 from RN 40; El Calafate to El Chaltén is 220 km, all paved.
  source_url: https://www.argentina.gob.ar/parquesnacionales/losglaciares/como-llegar
  evidence_heading: Puntos de entrada al parque / En auto
- field: public_transport
  value: Regular buses run daily between El Calafate and El Chaltén, and long-distance buses reach the El Chaltén terminal from other parts of Argentina and from Punta Arenas and Puerto Natales in Chile.
  source_url: https://www.argentina.gob.ar/parquesnacionales/losglaciares/como-llegar
  evidence_heading: Ómnibus
- field: nearest_town
  value:
    name: El Chaltén
    note: Base for Zona Norte services and trails.
  source_url: https://www.argentina.gob.ar/parquesnacionales/losglaciares/como-llegar
  evidence_heading: Puntos de entrada al parque
