slug: plain-of-six-glaciers
deleted_facts:
- field: distance_km
  value: 5.9
  note: The page lists 5.9 km one way from the Lake Louise Lakeshore lot; it also describes a 14.3 km loop if combined with the Lake Agnes trail.
  basis: one_way
  source_url: https://parks.canada.ca/pn-np/ab/banff/activ/randonnee-hiking
  evidence_heading: Plain of Six Glaciers Trail
- field: elevation_gain_m
  value: 595
  note: Page gives 595 m gain and 250 m loss for the one-way walk.
  source_url: https://parks.canada.ca/pn-np/ab/banff/activ/randonnee-hiking
  evidence_heading: Plain of Six Glaciers Trail
- field: duration
  value:
    min_hours: 4
    max_hours: 4
  note: Estimated round-trip time stated as 4 hours.
  source_url: https://parks.canada.ca/pn-np/ab/banff/activ/randonnee-hiking
  evidence_heading: Plain of Six Glaciers Trail
- field: best_months
  value:
  - 7
  - 8
  - 9
  note: Park says prime hiking season runs July to mid-September; most alpine passes are snow-free by mid-July.
  source_url: https://parks.canada.ca/pn-np/ab/banff/activ/randonnee-hiking
  evidence_heading: Hiking
- field: season_note
  value: Passes stay snow-bound with avalanche hazard until late June and trails are muddier early on; the teahouse on the route is seasonal.
  source_url: https://parks.canada.ca/pn-np/ab/banff/activ/randonnee-hiking
  evidence_heading: Hiking
- field: hazard
  value:
    type: avalanche
    note: Until late June many passes are snow-bound and may be subject to avalanche hazard.
  source_url: https://parks.canada.ca/pn-np/ab/banff/activ/randonnee-hiking
  evidence_heading: Hiking
- field: hazard
  value:
    type: weather
    note: Mountain weather changes quickly and snow can fall in any month; carry layers, food and water treatment.
  source_url: https://parks.canada.ca/pn-np/ab/banff/activ/randonnee-hiking
  evidence_heading: Safety
- field: rule_dogs
  value:
    value: restricted
    note: Dogs must be kept on a leash and under physical control at all times.
  source_url: https://parks.canada.ca/pn-np/ab/banff/activ/randonnee-hiking
  evidence_heading: Safety
- field: parking
  value: Trailhead is the Lake Louise Lakeshore lot, 4 km from the community of Lake Louise; parking there is paid.
  source_url: https://parks.canada.ca/pn-np/ab/banff/activ/randonnee-hiking
  evidence_heading: Plain of Six Glaciers Trail
- field: public_transport
  value: The trailhead is reachable by transit; the page names the Parks Canada Shuttle and Roam route 8x.
  source_url: https://parks.canada.ca/pn-np/ab/banff/activ/randonnee-hiking
  evidence_heading: Plain of Six Glaciers Trail
- field: trailhead_access
  value: Start at the Lake Louise Lakeshore parking lot about 4 km from Lake Louise village.
  source_url: https://parks.canada.ca/pn-np/ab/banff/activ/randonnee-hiking
  evidence_heading: Plain of Six Glaciers Trail
- field: nearest_town
  value:
    name: Lake Louise
    note: Trailhead is 4 km from the community of Lake Louise.
  source_url: https://parks.canada.ca/pn-np/ab/banff/activ/randonnee-hiking
  evidence_heading: Plain of Six Glaciers Trail
