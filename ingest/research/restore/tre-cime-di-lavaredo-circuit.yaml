- field: parking
  value: The car park is beside Rifugio Auronzo at 2,333 m, reached by an automated toll barrier. The ticket covers parking for 12 hours from the booked time, and longer stays need a further booking.
  source_url: https://auronzo.info/parcheggio-tre-cime-di-lavaredo/
  evidence_heading: Accesso al parcheggio Tre Cime di Lavaredo e pedaggio
- field: trailhead_access
  value: A paved road of about 6 km leaves near Lago d'Antorno and ends at Rifugio Auronzo. It is usually open from late May to late October, but may be closed to traffic for safety in bad weather or road conditions. Winter tyres or chains are advised.
  source_url: https://auronzo.info/parcheggio-tre-cime-di-lavaredo/
  evidence_heading: Accesso al parcheggio Tre Cime di Lavaredo e pedaggio
- field: public_transport
  value: In summer Dolomitibus buses run to Rifugio Auronzo from Auronzo and Cortina. Shuttle 444 from Dobbiaco station runs mid-June to end of September and must be booked. The nearest train station is Calalzo di Cadore, or Dobbiaco on the South Tyrol side.
  source_url: https://auronzo.info/tre-cime-di-lavaredo-come-arrivare/
  evidence_heading: Come arrivare alle Tre Cime di Lavaredo con i mezzi pubblici
- field: rule_camping
  value:
    value: restricted
    note: Camping is banned in the car park areas, with fines of 100 to 500 EUR. Sleeping inside a vehicle is allowed, but no tables, chairs or awnings outside.
  source_url: https://auronzo.info/parcheggio-tre-cime-di-lavaredo/
  evidence_heading: FAQ
- field: hazard
  value:
    type: weather
    note: In spring and autumn the huts may be closed and trails icy or snowy; in winter the area is covered in snow and ice and suits only equipped or guided visitors.
  source_url: https://auronzo.info/tre-cime-di-lavaredo-dolomiti/
  evidence_heading: FAQ
- field: nearest_town
  value:
    name: Auronzo di Cadore
    note: The toll road leaves from near Lago d'Antorno and Misurina, in this municipality.
  source_url: https://auronzo.info/parcheggio-tre-cime-di-lavaredo/
  evidence_heading: Accesso al parcheggio Tre Cime di Lavaredo e pedaggio
- field: closure
  value:
    status: partially_closed
    note: The municipality closed the Tre Cime road to vehicles from Monday 9 November 2026 at 08:00. The notice does not say when it reopens.
    as_of: 2026-11-15
