- field: parking
  value: Unsecured parking is available near each trailhead; staff at the orientation centres can tell you where vehicles may be left.
  source_url: https://parks.canada.ca/pn-np/bc/pacificrim/activ/sco-wct
  evidence_heading: Transportation to and from the West Coast Trail
- field: trailhead_access
  value: Pachena Bay orientation centre (5 km south of Bamfield) is reached on gravel logging roads from Port Alberni (2 h) or Duncan (3 h). Gordon River orientation centre (5 km north of Port Renfrew) is 2 h from Victoria on Highway 14 or 1.5 h from Duncan by logging road.
  source_url: https://parks.canada.ca/pn-np/bc/pacificrim/activ/sco-wct
  evidence_heading: Transportation to and from the West Coast Trail
- field: trailhead_access
  value: Balaats’adt (Nitinaht Village), 80 km south-east of Port Alberni, is reached by logging roads. One water taxi a day leaves the village dock at 8 a.m. for Nitinaht Narrows and returns at 4:30 p.m., so a night in the village may be needed; pay the operator directly.
  source_url: https://parks.canada.ca/pn-np/bc/pacificrim/activ/sco-wct
  evidence_heading: Transportation to and from the West Coast Trail
- field: public_transport
  value: West Coast Trail Express buses run to Pachena Bay from Victoria (5.5 h) and Nanaimo (3.5 h) and to Gordon River from Victoria (2 h); a taxi links Bamfield with the Pachena Bay trailhead. Parks Canada lists these for convenience only and suggests booking ahead.
  source_url: https://parks.canada.ca/pn-np/bc/pacificrim/activ/sco-wct
  evidence_heading: Transportation to and from the West Coast Trail
- field: public_transport
  value: Ferries run by the Ditidaht and Pacheedaht First Nations cross Gordon River (daily 1 May-7 October, set departures 8:45 a.m.-3:30 p.m.) and Nitinaht Narrows (daily 1 May-7 October, on demand 8:30 a.m.-4:30 p.m.); ferry fees are paid when you reserve.
  source_url: https://parks.canada.ca/pn-np/bc/pacificrim/activ/sco-wct
  evidence_heading: Ferry crossings and access points
- field: rule_dogs
  value:
    value: not_allowed
    note: Domestic animals are banned on the trail between Pachena Bay and Gordon River; elsewhere in the West Coast Trail Unit they must be leashed.
  source_url: https://parks.canada.ca/pn-np/bc/pacificrim/bulletins/F8E8283D-0FA3-4283-ACB9-8CAA4DF6F81A
  evidence_heading: 'West Coast Trail Unit: AREA CLOSED TO DOMESTIC ANIMALS'
- field: rule_drones
  value:
    value: not_allowed
    note: All Parks Canada places are no-drone zones for recreation; other flights need the Superintendent's approval, and flying without a permit can bring fines of up to $25,000.
  source_url: https://parks.canada.ca/pn-np/bc/pacificrim/securite-safety
  evidence_heading: Flying for fun
- field: rule_camping
  value:
    value: restricted
    note: From 1 May to 7 October, backcountry camping is only for hikers who did the WCT orientation and check-in and hold a backcountry use permit (with ferry fees) and, where needed, a park entry permit; trail runners on day trips face the same rules.
  source_url: https://parks.canada.ca/pn-np/bc/pacificrim/bulletins/6F9E8E5E-90C4-46AA-8AED-64C5FADCBD45
  evidence_heading: 'West Coast Trail Unit: RESTRICTED ACTIVITY - Backcountry camping'
- field: rule_camping
  value:
    value: restricted
    note: No camping at all between km 34 and 38, whether on the beach, dunes, trail, in the forest or along the Cheewhat River.
  source_url: https://parks.canada.ca/pn-np/bc/pacificrim/bulletins/2677447F-172E-4402-8CCB-F993537A25F9
  evidence_heading: 'West Coast Trail Unit: PROHIBITED ACTIVITY - No camping between km 34-38'
- field: rule_fires
  value:
    value: restricted
    note: Only small fires of wrist-thick or thinner driftwood, on beaches below the high tide line; never in the forest. Check for fire bans first and cook on a stove.
  source_url: https://parks.canada.ca/pn-np/bc/pacificrim/activ/sco-wct
  evidence_heading: 'Backcountry etiquette: low impact camping'
- field: rule_group_size
  value:
    value: restricted
    max_group: 10
    note: Groups may have at most 10 hikers; custodial groups may have up to 18.
  source_url: https://parks.canada.ca/pn-np/bc/pacificrim/activ/sco-wct
  evidence_heading: Planning your West Coast Trail adventure
- field: hazard
  value:
    type: river_crossing
    note: Some creeks and rivers must be waded; never cross above knee depth, and expect to wait a day or more for floods to fall. Cable cars over rivers may be out of action.
  source_url: https://parks.canada.ca/pn-np/bc/pacificrim/activ/sco-wct
  evidence_heading: A safe and enjoyable trip
- field: hazard
  value:
    type: tides
    note: High tides can make beach sections hard or impossible to pass; use the Tofino tide tables and the WCT map to avoid being cut off at headlands, and watch for large waves and swells near the water.
  source_url: https://parks.canada.ca/pn-np/bc/pacificrim/activ/sco-wct
  evidence_heading: A safe and enjoyable trip
- field: hazard
  value:
    type: weather
    note: 'Temperate rainforest: about 330 cm of rain a year, frequent fog in July and August and cool summers (about 14 C). Hypothermia and injuries rise sharply during long wet spells.'
  source_url: https://parks.canada.ca/pn-np/bc/pacificrim/activ/sco-wct
  evidence_heading: Are you prepared for a multi-day backcountry hike?
- field: hazard
  value:
    type: wildlife
    note: Black bears, wolves and cougars use the beaches and trail. Parks Canada strongly recommends at least one person in each group carries bear spray and knows how to use it.
  source_url: https://parks.canada.ca/pn-np/bc/pacificrim/activ/sco-wct
  evidence_heading: Living with wildlife
- field: hazard
  value:
    type: remoteness
    note: Help can take over 24 hours to reach you, and cell coverage is patchy, so carry a satellite messenger or VHF radio. Parks Canada evacuates 60-80 seriously injured hikers each season.
  source_url: https://parks.canada.ca/pn-np/bc/pacificrim/activ/sco-wct
  evidence_heading: Staying safe
- field: hazard
  value:
    type: other
    note: 'Damaged structures: this remote Type 3 trail has broken or missing boardwalk, exposed nails, ladders missing rungs, cable cars out of service and fallen trees, and more than 100 ladder systems to climb.'
  source_url: https://parks.canada.ca/pn-np/bc/pacificrim/activ/sco-wct
  evidence_heading: Is this hike for you?
- field: hazard
  value:
    type: other
    note: 'Tsunami: if the ground shakes or the sea pulls back fast, head for high ground at once, aiming to climb 20 m within 20 minutes.'
  source_url: https://parks.canada.ca/pn-np/bc/pacificrim/activ/sco-wct
  evidence_heading: A safe and enjoyable trip
- field: hazard
  value:
    type: other
    note: 'Shellfish: do not eat clams, mussels or oysters, as paralytic shellfish poisoning occurs regularly and can kill.'
  source_url: https://parks.canada.ca/pn-np/bc/pacificrim/activ/sco-wct
  evidence_heading: A safe and enjoyable trip
- field: nearest_town
  value:
    name: Bamfield
    note: The northern Pachena Bay trailhead is 5 km south of Bamfield; the southern Gordon River trailhead is 5 km north of Port Renfrew. Both villages have basic services but no banking.
  source_url: https://parks.canada.ca/pn-np/bc/pacificrim/activ/sco-wct
  evidence_heading: Transportation to and from the West Coast Trail
- field: closure
  value:
    status: seasonal
    note: Annual closure 7 October-30 April, in force on 2026-11-15. Only day use from the Pachena Bay trailhead to km 8 is allowed, with a park permit, entering and leaving at Pachena Bay the same day; no overnight use.
    as_of: 2026-11-15
  source_url: https://parks.canada.ca/pn-np/bc/pacificrim/bulletins/2A8FF4A7-9D2D-4D0F-903F-E32D7F583EFC
  evidence_heading: 'West Coast Trail: AREA CLOSURE - October 7 to April 30'
- field: closure
  value:
    status: partially_closed
    note: By Superintendent Order the public may not enter the Carmanah Point or Pachena Point light stations or the land around them.
    as_of: 2026-11-15
  source_url: https://parks.canada.ca/pn-np/bc/pacificrim/activ/sco-wct
  evidence_heading: 'West Coast Trail: Hike of a lifetime'
