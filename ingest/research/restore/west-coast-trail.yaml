slug: west-coast-trail
deleted_facts:
- field: season_note
  value: Open to overnight hikers from 1 May to 30 September; shut from 7 October to 30 April because of long heavy rain, strong winds, high tides, big waves and short days. Plan at least 2-3 nights from Nitinaht Narrows to Pachena Bay and 4-5 nights to Gordon River.
  source_url: https://parks.canada.ca/pn-np/bc/pacificrim/activ/sco-wct
  evidence_heading: Planning your West Coast Trail adventure
- field: permit
  value:
    name: West Coast Trail Backcountry Use Permit
    kind: quota
    how_to_apply: Reserve a start date and entry point (Pachena Bay, Nitinaht or Gordon River) with the Parks Canada Reservation Service online or on 1-877-737-3783. Watch the online Hiker Safety Primer, then attend a pre-hike briefing at your trailhead, where permits, map and tide tables are issued.
    booking_window: 2026 reservations opened 8 a.m. PT 5 February 2026; bookings close 2 days before departure; no standby spaces
    official_url: https://parks.canada.ca/pn-np/bc/pacificrim/activ/sco-wct
    months:
    - 5
    - 6
    - 7
    - 8
    - 9
  note: Daily hiker numbers are capped. Briefings at Gordon River and Pachena Bay run at 10 a.m. and 2 p.m. (from the day before); Nitinaht at 7 a.m. No permit for children under 6, and the trail is not advised for under-12s.
  source_url: https://parks.canada.ca/pn-np/bc/pacificrim/activ/sco-wct
  evidence_heading: Reservations
- field: permit
  value:
    name: Pacific Rim National Park Reserve entry pass
    kind: other
    how_to_apply: Everyone 18 or older needs a valid park entry pass, carried on the trail, in addition to the WCT permit. Daily passes are sold at park facilities including the WCT orientation centres and at listed local outlets; annual and Discovery passes also online.
    official_url: https://parks.canada.ca/pn-np/bc/pacificrim/activ/sco-wct
  note: Youth aged 17 and under get in free but still need a pass. Entry passes are not paid through the WCT reservation; they can be bought in person at the orientation centres before starting.
  source_url: https://parks.canada.ca/pn-np/bc/pacificrim/activ/sco-wct
  evidence_heading: National Park Entry Pass
- field: fee
  value:
