- field: distance_km
  value: 6.1
  basis: one_way
  note: Stated for both directions, Eigergletscher to Alpiglen and the reverse.
  source_url: https://www.jungfrau.ch/en-gb/kleine-scheidegg/eiger-trail/
  evidence_heading: Where would you like to start your hike?
- field: elevation_gain_m
  value: 78
  note: Ascent when walking from Eigergletscher to Alpiglen; the page gives 779 m descent that way. Walking from Alpiglen the figures swap (779 m up, 78 m down).
  source_url: https://www.jungfrau.ch/en-gb/kleine-scheidegg/eiger-trail/
  evidence_heading: Where would you like to start your hike?
- field: high_point_m
  value: 2346
  note: Highest point stated on the page; the start at Eigergletscher is listed as 2348 m and the end as 1616 m in the header.
  source_url: https://www.jungfrau.ch/en-gb/kleine-scheidegg/eiger-trail/
  evidence_heading: Where would you like to start your hike?
- field: duration
  value:
    min_hours: 2
    max_hours: 2.5
  note: 2:00 h from Eigergletscher downhill, 2:30 h from Alpiglen uphill.
  source_url: https://www.jungfrau.ch/en-gb/kleine-scheidegg/eiger-trail/
  evidence_heading: Where would you like to start your hike?
- field: difficulty_official
  value:
    label: Moderate
    scale: Jungfrau Railways
  source_url: https://www.jungfrau.ch/en-gb/kleine-scheidegg/eiger-trail/
  evidence_heading: Where would you like to start your hike?
- field: public_transport
  value: The trail starts at Eigergletscher railway station and ends at Alpiglen station, both on the railway. The operator says the train ride is included in its hike ticket, whichever end you start from.
  source_url: https://www.jungfrau.ch/en-gb/kleine-scheidegg/eiger-trail/
  evidence_heading: Where would you like to start your hike?
- field: trailhead_access
  value: Grindelwald Grund is described as the valley station for Kleine Scheidegg, with a large car park and a rail link; Eigergletscher is the start for hikes below the Eiger north face.
  source_url: https://www.jungfrau.ch/en-gb/arrival-at-station-car-parks/
  evidence_heading: Grindelwald Grund railway station
- field: hazard
  value:
    type: other
    note: The operator says trails are used at the walker's own risk and that its trail condition notes are recommendations only.
  source_url: https://www.jungfrau.ch/en-gb/kleine-scheidegg/eiger-trail/
  evidence_heading: Eiger Trail
- field: nearest_town
  value:
    name: Grindelwald
    note: Grindelwald railway station links to the Wengernalp Railway and Kleine Scheidegg.
  source_url: https://www.jungfrau.ch/en-gb/arrival-at-station-car-parks/
  evidence_heading: Grindelwald railway station
