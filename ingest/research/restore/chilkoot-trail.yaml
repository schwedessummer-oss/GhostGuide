- field: trailhead_access
  value: The southern (US) trailhead is reached by road, just north of the old Dyea townsite about 10 mi (16 km) from Skagway; arrange your ride to it in advance.
  source_url: https://www.nps.gov/klgo/planyourvisit/planning-your-hike.htm
  evidence_heading: Chilkoot Trailhead
- field: trailhead_access
  value: 'Bennett, the northern trailhead, has no road: you arrive or leave by train, air taxi or boat, booked with the carrier ahead of time. Walking the railway is illegal, and there is no cell signal, so bring a satellite messenger.'
  source_url: https://www.nps.gov/klgo/planyourvisit/planning-your-hike.htm
  evidence_heading: Bennett
- field: parking
  value: Anyone leaving a vehicle in Dyea has to use the Chilkoot Trailhead parking area.
  source_url: https://www.nps.gov/klgo/planyourvisit/planning-your-hike.htm
  evidence_heading: Arriving to the Chilkoot Trailhead
- field: public_transport
  value: Bennett is served only by the White Pass and Yukon Route railway (1-800-343-7373), floatplane firms (Alkan Air, Alpine Aviation, Amber Airways) or boat; book with the carrier directly and carry a satellite device to reach them at the end.
  source_url: https://parks.canada.ca/lhn-nhs/yt/chilkoot/activ/randonnee-cdn-hiking
  evidence_heading: Getting to and from Bennett
- field: rule_dogs
  value:
    value: restricted
    note: Parks Canada advises leaving pets at home. Any pet must stay leashed at all times, keep out of cooking shelters, and have its food locked in the bear boxes.
  source_url: https://parks.canada.ca/lhn-nhs/yt/chilkoot/visit/regles-rules/conditions
  evidence_heading: 7. Pets must be on a leash at all times
- field: rule_drones
  value:
    value: not_allowed
    note: Recreational drone use is banned in national parks and historic sites in Yukon and northern BC, which includes the Canadian part of the trail; special permits are only for research or filming.
  source_url: https://parks.canada.ca/lhn-nhs/yt/chilkoot/visit/regles-rules/aeronefs-aircraft
  evidence_heading: Flying in and around national parks and historic sites in Yukon and northern British Columbia
- field: rule_camping
  value:
    value: restricted
    note: Designated campgrounds only, named night by night in your reservation along with the number of tent sites (plan on at least two hikers per site). No camping at Chilkoot Pass.
  source_url: https://parks.canada.ca/lhn-nhs/yt/chilkoot/activ/randonnee-cdn-hiking
  evidence_heading: Choosing your campgrounds
- field: rule_fires
  value:
    value: not_allowed
    note: 'No open fires anywhere on the trail; bring a stove. Some shelters below treeline have wood stoves: on the US side only dead and down wood may be gathered, on the Canadian side wood is supplied and collecting it is banned.'
  source_url: https://parks.canada.ca/lhn-nhs/yt/chilkoot/visit/regles-rules/conditions
  evidence_heading: 6. No campfires
- field: hazard
  value:
    type: avalanche
    note: The slope between Happy Camp and Chilkoot Pass is avalanche terrain until mid-July. Cross early in the day, avoid the afternoon, never rest below avalanche signs, and move through one at a time with gaps.
  source_url: https://parks.canada.ca/lhn-nhs/yt/chilkoot/securite-safety/ete-summer
  evidence_heading: Avalanche hazard
- field: hazard
  value:
    type: weather
    note: Above treeline, between Deep Lake and the pass, expect cold, wet, windy or whiteout conditions; heavy rain or snowstorms can arrive even in midsummer, and fog often cuts visibility.
  source_url: https://parks.canada.ca/lhn-nhs/yt/chilkoot/securite-safety/ete-summer
  evidence_heading: Travel conditions
- field: hazard
  value:
    type: other
    note: 'Snowfields and route finding: between Happy Camp and the pass the way is an unmarked route that can stay snow-covered into July or all season, and snow or ice bridges over streams and rocks can give way without warning.'
  source_url: https://parks.canada.ca/lhn-nhs/yt/chilkoot/securite-safety/ete-summer
  evidence_heading: Snowfields
- field: hazard
  value:
    type: river_crossing
    note: 'Swollen creeks may have to be waded: keep footwear on, face upstream, lean on poles or a stick and link arms if needed.'
  source_url: https://parks.canada.ca/lhn-nhs/yt/chilkoot/securite-safety/ete-summer
  evidence_heading: Creek crossing
- field: hazard
  value:
    type: cold
    note: Frequent cold, wet and windy weather makes hypothermia a real danger; skip cotton and carry spare warm layers, good rain gear and a hat.
  source_url: https://parks.canada.ca/lhn-nhs/yt/chilkoot/securite-safety/ete-summer
  evidence_heading: Hypothermia
- field: hazard
  value:
    type: remoteness
    note: There is no cell coverage in the historic site, so carry a satellite device. Helicopter evacuations happen every year, and injured hikers may be billed for rescue and medical care.
  source_url: https://parks.canada.ca/lhn-nhs/yt/chilkoot/securite-safety/ete-summer
  evidence_heading: Injuries and evacuations
- field: hazard
  value:
    type: wildlife
    note: Black and grizzly bear country. Parks Canada recommends carrying bear spray at all times, keeping packs within arm's reach and locking every attractant in the campground food lockers.
  source_url: https://parks.canada.ca/lhn-nhs/yt/chilkoot/securite-safety/ours-bears
  evidence_heading: Bear safety
- field: nearest_town
  value:
    name: Skagway
    note: The Chilkoot Trailhead near Dyea is about 10 mi (16 km) from Skagway, where the Trail Center runs the mandatory US-side orientation and validates permits.
  source_url: https://www.nps.gov/klgo/planyourvisit/planning-your-hike.htm
  evidence_heading: Chilkoot Trailhead
- field: licensed_operator_list_url
  value: https://parks.canada.ca/lhn-nhs/yt/chilkoot/visit/guides
  note: Parks Canada's list of guides and outfitters for the historic site (three companies when the page was last updated in January 2026).
  source_url: https://parks.canada.ca/lhn-nhs/yt/chilkoot/visit/guides
  evidence_heading: Guides and outfitters
