slug: wonderland-trail
deleted_facts:
- field: season_note
  value: Usually mostly free of snow from mid-July into October. In an average snow year the park advises waiting until mid- to late July; earlier trips need winter skills such as expert navigation, ice-axe self-arrest and fording glacial rivers.
  source_url: https://www.nps.gov/mora/planyourvisit/the-wonderland-trail.htm
  evidence_heading: The Wonderland Trail
- field: permit
  value:
    name: Wilderness permit - early access lottery
    kind: lottery
    how_to_apply: Apply on Recreation.gov for the optional lottery in February. Winners get a personal access window between March and April in which they may book one itinerary before general sales; this is the park's recommended route to a full circuit.
    booking_window: Lottery opens in February (see Recreation.gov for dates); access windows March-April; early access ends 25 April
    official_url: https://www.recreation.gov/permits/4675317
    price:
      amount: 12.0
      currency: USD
      unit: per_night
      audience: all
      note: per person per night (up to 13 consecutive nights), plus a $6 Recreation.gov fee
  note: Lottery entrants may make only one reservation during early access; more can be booked after 25 April. A reservation is not a permit until the named holder activates it in person at a ranger station.
  source_url: https://www.nps.gov/mora/planyourvisit/wilderness-permit.htm
  evidence_heading: Early Access Lottery
- field: permit
  value:
    name: Wilderness permit - advance reservation (general on-sale)
    kind: quota
    how_to_apply: From 25 April, book any remaining camps on Recreation.gov at least two days before the start. The person named must then collect the permit in person at a ranger station, from one day before and by noon on the start day.
    booking_window: From 25 April, for trips between 1 June and 10 October; at least 2 days before the trip
    official_url: https://www.recreation.gov/permits/4675317
    price:
      amount: 12.0
      currency: USD
      unit: per_night
      audience: all
      note: per person per night (up to 13 consecutive nights/14 days), plus a $6 Recreation.gov fee
  note: About two thirds of summer (June-September) permits can be reserved. The park warns a full Wonderland itinerary is unlikely once general sales open. Unclaimed reservations are cancelled at noon on the start day.
  source_url: https://www.nps.gov/mora/planyourvisit/wilderness-permit.htm
  evidence_heading: General On-Sale
- field: permit
  value:
    name: Wilderness permit - walk-up (first come, first served)
    kind: overnight
    how_to_apply: Go in person to a wilderness information center in the park on your start day or the day before. Permits are not issued by phone; camps depend on what is left.
    booking_window: Same day or one day before the trip start
    official_url: https://www.nps.gov/mora/planyourvisit/wilderness-permit.htm
    price:
      amount: 12.0
      currency: USD
      unit: per_night
      audience: all
      note: per person per night, plus the non-refundable $6 reservation fee; card only, no cash
  note: Roughly one third of campsites are held back for walk-up permits. Summer permit offices are Longmire, Paradise and White River wilderness information centers.
  source_url: https://www.nps.gov/mora/planyourvisit/wilderness-permit.htm
  evidence_heading: How to Acquire a Walk-up Permit
- field: fee
  value:
    name: Wilderness permit fee
    amount: 12.0
    currency: USD
    unit: per_night
    audience: all
    valid_from: 2026-01-01
    valid_to: 2026-12-31
    note: 2026 rate, charged per person per night; individuals 15 and younger are free.
  source_url: https://www.nps.gov/mora/planyourvisit/wilderness-permit-faqs.htm
  evidence_heading: What is the wilderness permit fee structure in 2026?
- field: fee
  value:
    name: Recreation.gov application fee
    amount: 6.0
    currency: USD
    unit: per_application
    audience: all
    valid_from: 2026-01-01
    valid_to: 2026-12-31
    note: Charged once per trip.
  source_url: https://www.nps.gov/mora/planyourvisit/wilderness-permit-faqs.htm
  evidence_heading: What is the wilderness permit fee structure in 2026?
- field: fee
  value:
    name: Private vehicle entrance pass
    amount: 30.0
    currency: USD
    unit: per_vehicle
    audience: all
    note: Unlimited entry for 7 consecutive days for one private, non-commercial vehicle (up to 15 seats) and its passengers. The park takes no cash.
  source_url: https://www.nps.gov/mora/planyourvisit/fees.htm
  evidence_heading: Private Vehicle
- field: fee
  value:
    name: Motorcycle entrance pass
    amount: 25.0
    currency: USD
    unit: per_vehicle
    audience: all
    note: Valid 7 days; covers up to 2 private motorcycles with up to 4 people in total.
  source_url: https://www.nps.gov/mora/planyourvisit/fees.htm
  evidence_heading: Motorcycle
- field: fee
  value:
    name: Per-person entrance pass (on foot or bicycle)
    amount: 15.0
    currency: USD
    unit: per_person
    audience: all
    note: For visitors 16 and older arriving without a vehicle; valid 7 consecutive days. Under-16s need no pass.
  source_url: https://www.nps.gov/mora/planyourvisit/fees.htm
  evidence_heading: Per Person
- field: fee
  value:
    name: Mount Rainier annual park pass
    amount: 55.0
    currency: USD
    unit: per_vehicle
    audience: resident
    note: One year of entry for the holder and passengers in one private vehicle; sold to US citizens and residents; no camping fees covered.
  source_url: https://www.nps.gov/mora/planyourvisit/fees.htm
  evidence_heading: Annual Entrance - Park
- field: trailhead_access
  value: 'Several trailheads reach the trail: Longmire, Mowich Lake, Sunrise parking lot, White River Campground, Cowlitz Divide, Box Canyon, Reflection Lakes, Narada Falls and Cougar Rock Campground. The circuit''s mileage depends on which one you start from.'
  source_url: https://www.nps.gov/mora/planyourvisit/the-wonderland-trail.htm
  evidence_heading: Trailheads along the Wonderland Trail
- field: trailhead_access
  value: 'There is no public access to Carbon River or Mowich Lake: the SR 165 bridge is closed to vehicles, bikes and walkers with no detour. The Summerland Trailhead is closed through 2029 for Fryingpan Creek Bridge work. Sunrise and White River roads are closed for winter.'
  source_url: https://www.nps.gov/mora/planyourvisit/road-status.htm
  evidence_heading: Road Status
- field: nearest_town
  value:
    name: Ashford
    note: Town just outside the Nisqually Entrance in the park's southwest corner, the entrance used for Longmire; 85 miles one way from Seattle.
  source_url: https://www.nps.gov/mora/planyourvisit/directions.htm
  evidence_heading: By Plane
- field: rule_camping
  value:
    value: restricted
    note: Hikers doing the full circuit may camp only in designated camps, never in cross-country zones, and only at the camp named on their permit for that night. No party may stay more than four nights in a row in one camp or zone.
  source_url: https://www.nps.gov/mora/planyourvisit/wilderness-guidelines-and-regulations.htm
  evidence_heading: Wilderness Camping and Climbing Policies
- field: rule_group_size
  value:
    value: restricted
    max_group: 12
    note: In summer, individual camp sites take parties of up to 5; groups of 6 to 12 must use the group sites found at 25 designated camps. Large groups may not split up on the same itinerary to dodge the limit.
  source_url: https://www.nps.gov/mora/planyourvisit/wilderness-guidelines-and-regulations.htm
  evidence_heading: Party Size
- field: rule_fires
  value:
    value: not_allowed
    note: Fires are banned on trails and in the backcountry. White gas, iso-butane cartridge and alcohol stoves are fine; stoves that burn twigs or cones are not.
  source_url: https://www.nps.gov/mora/planyourvisit/wilderness-guidelines-and-regulations.htm
  evidence_heading: For the care of the wilderness
- field: rule_dogs
  value:
    value: not_allowed
    note: The park bars pets from its backcountry, along with fires, bikes and other wheeled devices.
  source_url: https://www.nps.gov/mora/planyourvisit/the-wonderland-trail.htm
  evidence_heading: The Wonderland Trail
- field: rule_drones
  value:
    value: not_allowed
    note: Launching, landing or flying a drone anywhere on NPS-administered land or water in the park is prohibited under the Superintendent's Compendium.
  source_url: https://www.nps.gov/mora/planyourvisit/conditions.htm
  evidence_heading: Drones
- field: hazard
  value:
    type: river_crossing
    note: River crossings and log footbridges often wash out, which can strand hikers; cross early in the day when water is lowest and take great care fording. Washed-out crossings are not rebuilt until the next spring or summer.
  source_url: https://www.nps.gov/mora/planyourvisit/trails-and-backcountry-camp-conditions.htm
  evidence_heading: Backcountry Trails and Camp Reports
- field: hazard
  value:
    type: volcanic
    note: 'Rainier is a glacier-capped volcano: glacier outburst floods and debris flows can strike suddenly. Learn the warning signs and how to reach safety.'
  source_url: https://www.nps.gov/mora/planyourvisit/hiking-safety.htm
  evidence_heading: Hiking in Geohazard Zones
- field: hazard
  value:
    type: lightning
    note: Thunderstorms occur on Mount Rainier and can build unseen behind the mountain. Lightning strikes are most often deadly; descend quickly, and get out of your tent if a storm hits since poles attract lightning.
  source_url: https://www.nps.gov/mora/planyourvisit/hiking-safety.htm
  evidence_heading: Thunderstorms and Lightning
- field: hazard
  value:
    type: remoteness
    note: Most of the park has no cell coverage. Tell someone your plans, avoid hiking alone and consider a personal locator beacon.
  source_url: https://www.nps.gov/mora/planyourvisit/hiking-safety.htm
  evidence_heading: Use Common Sense
- field: hazard
  value:
    type: other
    note: 'Snow: before mid- to late July in an average year, the route needs winter travel skills, including expert navigation, ice-axe self-arrest and fording dangerous glacial rivers.'
  source_url: https://www.nps.gov/mora/planyourvisit/the-wonderland-trail.htm
  evidence_heading: The Wonderland Trail
- field: closure
  value:
    status: partially_closed
    note: Closed between Carbon River and Summerland because of the Grand Park 2 and Garda Falls fires; no full-circuit permits until further notice. The Upper Fryingpan Creek crossing (White River Campground to Summerland) is out.
    as_of: 2026-10-16
  source_url: https://www.nps.gov/mora/planyourvisit/trails-and-backcountry-camp-conditions.htm
  evidence_heading: Wonderland Trail
