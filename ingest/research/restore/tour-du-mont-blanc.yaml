slug: tour-du-mont-blanc
deleted_facts:
- field: difficulty_official
  value:
    label: Difficult
    scale: Autour du Mont-Blanc
  source_url: https://www.autourdumontblanc.com/en/routes/all-routes/tour-du-mont-blanc
  evidence_heading: Tour du Mont Blanc
- field: public_transport
  value: The route page says public transport and lifts can be used to shorten the walk, and that many villages around the massif work as start points.
  source_url: https://www.autourdumontblanc.com/en/routes/all-routes/tour-du-mont-blanc
  evidence_heading: Description
- field: rule_camping
  value:
    value: restricted
    note: Wild camping is largely banned along the route. Aosta Valley bans camping and bivouacs below 2,500 m. Swiss Valais municipalities on the route prohibit bivouacs and allow camping only at designated sites. Chamonix bans camping outside designated sites and tolerates only high-altitude bivouacs from sunset to sunrise. Booking a pitch is mandatory in the Aiguilles Rouges nature reserves from 1 June to 30 September.
  source_url: https://www.autourdumontblanc.com/en/accomodations/bivouac
  evidence_heading: Bivouac and wild camping
- field: hazard
  value:
    type: rockfall
    note: A Swiss section between Prayon and Branche (Treutsebo sector) was rerouted because of rockfall risk; the signposted new path was due to open on 11 July 2026 and the old path is closed.
  source_url: https://www.autourdumontblanc.com/en/
  evidence_heading: 'Route diversion in the Swiss sector: path between Prayon and Branche (Treutsebo sector)'
- field: hazard
  value:
    type: lightning
    note: The site warns that storms can build quickly on hot summer days and gives guidance on seeking shelter away from ridges and water.
  source_url: https://www.autourdumontblanc.com/en/safety/mountain-hazards-and-equipment
  evidence_heading: Mountain hazards / Storms
- field: hazard
  value:
    type: weather
    note: Snowfields can persist on trails even early in the season; they can hide markings and be slippery, and snow bridges over streams can collapse. The site advises crampons, ice axe and navigation tools.
  source_url: https://www.autourdumontblanc.com/en/safety/mountain-hazards-and-equipment
  evidence_heading: Mountain hazards / Snow and snowfields
- field: closure
  value:
    status: partially_closed
    note: Old path between Prayon and Branche (Les Treutsebo, Switzerland) is closed for rockfall risk and must not be used; a signposted diversion was to open on 11 July 2026. Camping and bivouacking are banned in that area.
    as_of: '2026-11-15'
  source_url: https://www.autourdumontblanc.com/en/
  evidence_heading: 'Route diversion in the Swiss sector: path between Prayon and Branche (Treutsebo sector)'
- field: season_note
  value: The Casermetta Espace Mont-Blanc visitor centre at Col de la Seigne was announced as open daily from 25 June to 13 September 2026.
  source_url: https://www.autourdumontblanc.com/en/
  evidence_heading: Summer 2026 - Opening of Casermetta Espace Mont-Blanc
