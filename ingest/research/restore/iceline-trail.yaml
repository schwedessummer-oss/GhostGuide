slug: iceline-trail
deleted_facts:
- field: route_type
  value: loop
  note: Park calls it a signature circuit that returns past Laughing Falls.
  source_url: https://parks.canada.ca/pn-np/bc/yoho/activ/arrierepays-backcountry
  evidence_heading: Where to go
- field: season_note
  value: Yoho Valley Road, the only way to the trailhead, is open only from mid-June to mid-October; snow is common at height even in summer.
  source_url: https://parks.canada.ca/pn-np/bc/yoho/activ/arrierepays-backcountry
  evidence_heading: When to go
- field: trailhead_access
  value: Trailhead is the Takakkaw Falls parking lot, 17 km east of Field via the Trans-Canada Highway and Yoho Valley Road. Road is open mid-June to mid-October; RVs and trailers are not allowed because of tight switchbacks.
  source_url: https://parks.canada.ca/pn-np/bc/yoho/activ/arrierepays-backcountry
  evidence_heading: Iceline via Little Yoho
- field: nearest_town
  value:
    name: Field
    note: Trailhead distances are given from Field, B.C.
  source_url: https://parks.canada.ca/pn-np/bc/yoho/activ/arrierepays-backcountry
  evidence_heading: Iceline via Little Yoho
- field: permit
  value:
    name: Yoho backcountry permit
    kind: overnight
    how_to_apply: Reserve a campsite online with the Parks Canada reservation service or by phone; advance booking is needed at most sites in July to September.
    booking_window: 2026 reservations launched Monday 26 January 2026 at 8 am MT
    official_url: https://parks.canada.ca/pn-np/bc/yoho/activ/arrierepays-backcountry
    price:
      amount: 15.0
      currency: CAD
      unit: per_night
      audience: all
      note: Per person per night; plus a reservation fee (see Yoho fees page).
    months:
    - 7
    - 8
    - 9
  note: Months listed are those for which the page says advance reservations are needed.
  source_url: https://parks.canada.ca/pn-np/bc/yoho/activ/arrierepays-backcountry
  evidence_heading: Backcountry permits
- field: rule_dogs
  value:
    value: restricted
    note: Pets are welcome in the backcountry but must be leashed at all times; the park suggests leaving dogs at home.
  source_url: https://parks.canada.ca/pn-np/bc/yoho/activ/arrierepays-backcountry
  evidence_heading: Pets
- field: rule_drones
  value:
    value: not_allowed
    note: Drones are not permitted in the national park.
  source_url: https://parks.canada.ca/pn-np/bc/yoho/activ/arrierepays-backcountry
  evidence_heading: Wildlife and People
- field: rule_fires
  value:
    value: not_allowed
    note: Campfires are not permitted anywhere in the backcountry.
  source_url: https://parks.canada.ca/pn-np/bc/yoho/activ/arrierepays-backcountry
  evidence_heading: What to bring
- field: rule_camping
  value:
    value: restricted
    note: Camping only in designated campgrounds as shown on the reservation; 3 consecutive nights maximum; a backcountry permit copy must be shown on request.
  source_url: https://parks.canada.ca/pn-np/bc/yoho/activ/arrierepays-backcountry
  evidence_heading: Where to stay
- field: rule_group_size
  value:
    value: restricted
    max_group: 10
    note: Maximum group size per reservation is 10 people and 5 tents; 4 people and 1 tent per site.
  source_url: https://parks.canada.ca/pn-np/bc/yoho/activ/arrierepays-backcountry
  evidence_heading: Where to stay
- field: hazard
  value:
    type: wildlife
    note: Elk, wolves, cougars, grizzly and black bears live in the park; carry bear spray, make noise and keep 100 m from bears.
  source_url: https://parks.canada.ca/pn-np/bc/yoho/activ/arrierepays-backcountry
  evidence_heading: Wildlife and People
- field: hazard
  value:
    type: weather
    note: Mountain weather is unpredictable; prepare for winter conditions at any time of year.
  source_url: https://parks.canada.ca/pn-np/bc/yoho/activ/arrierepays-backcountry
  evidence_heading: What to bring
- field: closure
  value:
    status: closed
    note: Yoho Valley Road to Takakkaw Falls is closed to vehicles seasonally from mid-October to mid-June; the report shows it closed for the season on 2026-10-13.
    as_of: 2026-10-13
  source_url: https://parks.canada.ca/pn-np/bc/yoho/activ/randonnee-hike/etat-sentiers-trail-conditions
  evidence_heading: Roads
- field: fee
  value:
    name: Yoho National Park daily admission
    amount: 12.25
    currency: CAD
    unit: per_day
    audience: adult
    note: Ages 18 to 64. Currency inferred from the Parks Canada site.
  source_url: https://parks.canada.ca/pn-np/bc/yoho/visit/tarifs-fees
  evidence_heading: Fees - Admission - Daily
