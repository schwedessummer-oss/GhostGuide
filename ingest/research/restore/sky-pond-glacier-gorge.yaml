- field: distance_km
  value: 6.8
  basis: one_way
  note: The park's Glacier Gorge Trailhead table gives Sky Pond as 4.2 mi (6.8 km) one way; no round-trip figure is listed.
  source_url: https://www.nps.gov/romo/planyourvisit/exploring-the-bear-lake-road-corridor.htm
  evidence_heading: Glacier Gorge Trailhead
- field: elevation_gain_m
  value: 526
  note: Table lists 1,726 ft (526 m) of gain from a trailhead elevation of 9,175 ft (2,796 m); the metric value is the park's own and matches 1,726 x 0.3048.
  source_url: https://www.nps.gov/romo/planyourvisit/exploring-the-bear-lake-road-corridor.htm
  evidence_heading: Glacier Gorge Trailhead
- field: season_note
  value: The park counts late May to September as its summer season; trails above 9,000 ft can still be wintry in May and June.
  source_url: https://www.nps.gov/romo/plan-your-summer-trip-to-rocky.htm
  evidence_heading: What's the Weather Like?
- field: season_note
  value: The Loch Vale and Sky Pond area is listed under the park's raptor protection rules (named closures run 15 February to 31 July each year) and can be closed if trail use disturbs breeding birds.
  source_url: https://www.nps.gov/romo/learn/management/rmnp_compendium.htm
  evidence_heading: Raptor Closures
- field: permit
  value:
    name: Timed Entry+ Bear Lake Road reservation (2026 season)
    kind: vehicle_reservation
    how_to_apply: Book on Recreation.gov (website or app) or by phone on 877-444-6777; none are sold at entrance stations or visitor centers. One reservation per vehicle per day gives a 2-hour entry window, and a park entrance pass is still required.
    booking_window: Released at 8 a.m. MDT on May 1 (for May 22 - June 30), June 1 (July), July 1 (August), August 1 (September) and September 1 (October 1 - 18); extra reservations released at 7 p.m. MDT the night before
    official_url: https://www.nps.gov/romo/planyourvisit/timed-entry-permit-system.htm
    price:
      amount: 2.0
      currency: USD
      unit: per_application
      audience: all
      note: non-refundable Recreation.gov processing fee; one reservation covers one vehicle for one day
    months:
    - 5
    - 6
    - 7
    - 8
    - 9
    - 10
  note: Miss your window and you are sent back until after 2 p.m.; leaving the corridor and coming back is only allowed after 2 p.m. Overnight wilderness permits count as the reservation, and cyclists need none. A reservation does not guarantee parking.
  source_url: https://www.nps.gov/romo/planyourvisit/timed-entry-permit-system.htm
  evidence_heading: I'm Planning a Trip to Rocky During Summer or early Fall, When Can I Make a Timed Entry Reservation?
