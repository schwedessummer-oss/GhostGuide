- field: parking
  value: The Glacier Gorge parking area fills early every day; the park recommends leaving the car at the Park & Ride lot on Bear Lake Road and taking the Bear Lake shuttle to the trailhead.
  source_url: https://www.nps.gov/romo/planyourvisit/exploring-the-bear-lake-road-corridor.htm
  evidence_heading: Glacier Gorge Trailhead
- field: trailhead_access
  value: The trailhead lies on Bear Lake Road, a paved 9.2-mile road that leaves US 36/Trail Ridge Road about 0.2 mi from the Beaver Meadows Entrance and climbs to the Bear Lake parking area; stops along it include Park & Ride and the Glacier Gorge parking area.
  source_url: https://www.nps.gov/romo/planyourvisit/exploring-the-bear-lake-road-corridor.htm
  evidence_heading: Exploring the Bear Lake Road Corridor
- field: public_transport
  value: The free Bear Lake Shuttle ran daily from 22 May to 18 October 2026, 6:30 a.m. to 7:30 p.m. every 10-15 minutes, stopping at Park & Ride, Bierstadt Lake, Glacier Gorge Trailhead and Bear Lake. Service has ended for the season.
  source_url: https://www.nps.gov/romo/planyourvisit/shuttle-buses-and-public-transit.htm
  evidence_heading: Bear Lake Shuttle Route
- field: public_transport
  value: A ticketed Hiker Shuttle ran from the Estes Park Visitor Center to Park & Ride (daily 22 May-7 Sep 2026, then weekends to 18 Oct). Tickets come only from Recreation.gov at $2 per reservation of up to 4 riders, and each rider also needs an entrance pass.
  source_url: https://www.nps.gov/romo/planyourvisit/shuttle-buses-and-public-transit.htm
  evidence_heading: Staying in Estes Park? Make Reservations to Ride the Hiker Shuttle!
- field: rule_dogs
  value:
    value: not_allowed
    note: No pets on any trail, tundra or meadow in the park; leashed pets (6 ft maximum) are limited to roads, parking areas, campgrounds and picnic areas.
  source_url: https://www.nps.gov/romo/planyourvisit/pets.htm
  evidence_heading: Pets are prohibited on ALL Rocky Mountain National Park trails, tundra, and meadows.
- field: rule_drones
  value:
    value: not_allowed
    note: Taking off, landing or flying any unmanned aircraft (drones, quadcopters, model planes) inside the park is banned, whatever the purpose.
  source_url: https://www.nps.gov/romo/learn/management/unmanned_aircraft.htm
  evidence_heading: Unmanned Aircraft Prohibited
- field: rule_camping
  value:
    value: restricted
    note: Any overnight stay in the wilderness, bivouacs included, needs a permit that sets the site, nights and party size; parties are capped at 7 people at individual sites and 12 at group sites.
  source_url: https://www.nps.gov/romo/learn/management/rmnp_compendium.htm
  evidence_heading: Camping Activities Requiring a Permit
- field: rule_fires
  value:
    value: restricted
    note: Campfires only in park-supplied metal grates at auto campgrounds, designated picnic areas and approved residential areas; gas or petroleum stoves may be used for cooking at designated wilderness sites.
  source_url: https://www.nps.gov/romo/learn/management/rmnp_compendium.htm
  evidence_heading: Campfire Regulations
- field: hazard
  value:
    type: weather
    note: Weather varies with elevation and turns fast; from May to September a clear morning can give way to afternoon rain or even snow.
  source_url: https://www.nps.gov/romo/plan-your-summer-trip-to-rocky.htm
  evidence_heading: What's the Weather Like?
- field: hazard
  value:
    type: other
    note: 'Snow and ice: the ranger report of 22 Oct 2026 found ice and snow on trails above Glacier Gorge Trailhead and suggested traction devices and poles; the park warns high trails can keep snow and ice into summer.'
  source_url: https://www.nps.gov/romo/planyourvisit/trail_conditions.htm
  evidence_heading: Rocky Mountain National Park Trail Conditions Report
- field: hazard
  value:
    type: other
    note: 'Falling trees and branches: a year-round hazard in the park''s forests; they can drop with no warning, so keep an eye on the trees around you.'
  source_url: https://www.nps.gov/romo/planyourvisit/trail_conditions.htm
  evidence_heading: Hiking Safety - Pay Attention to Trees and Tree Branches
- field: nearest_town
  value:
    name: Estes Park
    note: The summer Hiker Shuttle leaves from the Estes Park Visitor Center in town for the Park & Ride hub on Bear Lake Road, about 45 minutes to an hour away.
  source_url: https://www.nps.gov/romo/planyourvisit/shuttle-buses-and-public-transit.htm
  evidence_heading: Staying in Estes Park? Make Reservations to Ride the Hiker Shuttle!
- field: closure
  value:
    status: open
    note: No closure is listed; the ranger report updated 22 Oct 2026 describes the Glacier Gorge trails with ice and some snow above the trailhead, with dry lower sections.
    as_of: 2026-11-15
  source_url: https://www.nps.gov/romo/planyourvisit/trail_conditions.htm
  evidence_heading: Rocky Mountain National Park Trail Conditions Report
